}
async function loadFolderSets(isActive){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const { data: qb } = await sb.from('qbanks').select('*').eq('id', S.nav.qbankId).maybeSingle();
  if(myToken !== navToken) return;
  const { data: folder } = await sb.from('folders').select('*').eq('id', S.nav.folderId).maybeSingle();
  if(myToken !== navToken) return;
  body.innerHTML += crumbBar([{label:'QBanks', onClick:true},{label:qb?.name||'QBank', onClick:true},{label:S.nav.category, onClick:true},{label: folder ? leafNameOf(folder.name) : 'Section'}]);
  document.querySelector('[data-crumb="0"]').onclick = ()=>{ goTo({nav:{}}); };
  document.querySelector('[data-crumb="1"]').onclick = ()=>{ goTo({nav:{qbankId:S.nav.qbankId}}); };
  document.querySelector('[data-crumb="2"]').onclick = ()=>{ goTo({nav:{qbankId:S.nav.qbankId, category:S.nav.category}}); };

  const { data: sets } = await sb.from('sets').select('*').eq('folder_id', folder.id).is('user_id', null).order('subject').order('set_number');
  if(myToken !== navToken) return;
  let html = '';
  if(!sets || !sets.length){ html = emptyStateHtml('🧩', 'No sets generated for this section yet', 'The admin hasn\'t added questions here yet.'); document.getElementById('utabBody').innerHTML += html; return; }

  // Everything every set row needs (this user's latest attempt, and its
  // rank stats) is fetched up front in a small, fixed number of batched
  // round trips — instead of the old approach of awaiting several queries
  // PER set inside a sequential for-loop, which was the main reason a
  // section with many sets/subsections felt slow to open.
  const setIds = sets.map(s=>s.id);
  const { data: allAttempts } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('status','submitted').in('set_id', setIds).order('submitted_at', {ascending:false});
  if(myToken !== navToken) return;
  const attemptBySet = {};
  (allAttempts||[]).forEach(a=>{ if(!attemptBySet[a.set_id]) attemptBySet[a.set_id] = a; }); // first hit per set = latest, since ordered desc
  const attemptedIds = Object.keys(attemptBySet);
  const rankResults = await Promise.all(attemptedIds.map(sid=>sb.rpc('set_rank_stats', { p_set_id: sid, p_user_id: S.profile.id })));
  if(myToken !== navToken) return;
  const rankBySet = {};
  attemptedIds.forEach((sid,i)=>{ const r = rankResults[i].data; rankBySet[sid] = Array.isArray(r)?r[0]:r; });
  const byNum = {}; sets.forEach(s=>{ byNum[s.set_number] = s; });

  // Show a one-time instructions/disclaimer screen with a "Start Exam"
  // button before a section's sets are revealed, the first time this user
  // opens it with nothing attempted yet — for every exam pattern, including
  // subject-wise sections (not just the sequential full-length patterns).
  // Re-opening later (or once something's been attempted) skips straight to
  // the sets list as before.
  const cfg = EXAM_CONFIG[folder.exam_type];
  if(cfg && attemptedIds.length===0 && !(S.instructionsAcked && S.instructionsAcked[folder.id])){
    const totalQ = sets.reduce((n,s)=>n+(s.question_ids?.length||0),0);
    const totalMin = Math.round(sets.reduce((n,s)=>n+(s.duration_minutes||0),0));
    const setRowsHtml = sets.map(s=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
        <span>Set ${s.set_number}</span><span class="muted">${(s.question_ids?.length||0)} questions · ${s.duration_minutes} min</span>
      </div>`).join('');
    document.getElementById('utabBody').innerHTML += instructionsCardHtml({
      title: leafNameOf(folder.name), totalQ, totalMin, setCount: sets.length, sequential: cfg.sequential, setRowsHtml
    });
    document.getElementById('startExamBtn').onclick = ()=>{
      S.instructionsAcked = S.instructionsAcked || {};
      S.instructionsAcked[folder.id] = true;
      loadFolderSets(isActive);
    };
    return;
  }

  if(folder.exam_type==='subjectwise'){
    const bySubject={};
    sets.forEach(s=>{ (bySubject[s.subject||'General']=bySubject[s.subject||'General']||[]).push(s); });
    for(const subj in bySubject){
      if(myToken !== navToken) return;
      html += `<div style="margin:14px 0 6px;font-weight:800;font-size:15px;color:var(--amber-2);">${subjectIcon(subj)} ${escapeHtml(subj)}</div>`;
      for(const s of bySubject[subj]) html += setRow(s, isActive, false, attemptBySet[s.id], rankBySet[s.id]);
    }
  } else {
    let allDone = true, anyDone = false;
    for(const s of sets){
      const prev = s.set_number>1 ? byNum[s.set_number-1] : null;
      const locked = EXAM_CONFIG[folder.exam_type].sequential && prev ? !attemptBySet[prev.id] : false;
      html += setRow(s, isActive, locked, attemptBySet[s.id], rankBySet[s.id]);
      if(attemptBySet[s.id]) anyDone = true; else allDone = false;
    }
    // Whole-section total: counts every subsection's score/correct/total
    // together in one go (not one set at a time), so you see the overall
    // percentage and where you rank against everyone else on this section,
    // as soon as you've submitted at least one subsection here. Once every
    // subsection is done, this becomes the full report card below.
    if(anyDone){
      const { data: fstats, error: fErr } = await sb.rpc('folder_rank_stats', { p_folder_id: folder.id, p_user_id: S.profile.id });
      if(myToken !== navToken) return;
      const frow = Array.isArray(fstats) ? fstats[0] : fstats;
      if(frow && frow.user_total){
        const fpct = Math.round((frow.user_correct/frow.user_total)*1000)/10;
        if(!allDone){
          html += `<div class="card" style="margin-top:14px;">
            <h3>Section total so far (${frow.sets_completed}/${frow.sets_total} subsections)</h3>
            <div class="muted">✅ ${frow.user_correct}/${frow.user_total} correct (${fpct}%) · score ${frow.user_score>0?'+':''}${frow.user_score}</div>
            ${rankBadgeHtml(frow)}
          </div>`;
        } else {
          // Full report card — only built once, right when the section is
          // finished, since it needs one extra (batched, single) query for
          // every question's community accuracy to classify tough/easy.
          const allQIds = [...new Set(sets.flatMap(s=>s.question_ids||[]))];
          const { data: accStats } = await sb.rpc('question_accuracy_stats', { p_question_ids: allQIds });
          if(myToken !== navToken) return;
          let hard=0, med=0, easy=0;
          (accStats||[]).forEach(s=>{
            if(!s.total_attempts) return;
            const acc = s.correct_attempts / s.total_attempts;
            if(acc<=0.4) hard++; else if(acc<=0.7) med++; else easy++;
          });
          const maxCount = Math.max(hard, med, easy, 1);
          html += `<div class="card reportcard" style="margin-top:16px;">
            <h2>📋 Section report card</h2>
            <div class="muted" style="margin-bottom:16px;">${folder.name} · all ${frow.sets_total} subsections complete</div>
            <div class="row" style="align-items:center;gap:26px;flex-wrap:wrap;">
              <div class="donut" style="--pct:${fpct}"><span>${fpct}%</span></div>
              <div>
                <div style="font-size:16px;"><b>${frow.user_correct}/${frow.user_total}</b> correct</div>
                <div class="muted" style="margin-top:2px;">Score: ${frow.user_score>0?'+':''}${frow.user_score}</div>
              </div>
            </div>
            ${rankBadgeHtml(frow)}
            <div style="margin-top:24px;">
              <div class="muted" style="margin-bottom:4px;">Question difficulty — based on how everyone has done on these so far</div>
              <div class="diffbars">
                <div class="diffbar"><div class="diffbar-count">${hard}</div><div class="diffbar-track"><div class="diffbar-fill hard" style="height:${Math.round(hard/maxCount*100)}%;"></div></div><div class="diffbar-label">🔴 Tough</div></div>
                <div class="diffbar"><div class="diffbar-count">${med}</div><div class="diffbar-track"><div class="diffbar-fill med" style="height:${Math.round(med/maxCount*100)}%;"></div></div><div class="diffbar-label">🟡 Medium</div></div>
                <div class="diffbar"><div class="diffbar-count">${easy}</div><div class="diffbar-track"><div class="diffbar-fill easy" style="height:${Math.round(easy/maxCount*100)}%;"></div></div><div class="diffbar-label">🟢 Easy</div></div>
              </div>
            </div>
          </div>`;
        }
      } else if(fErr){
        html += `<div class="card muted" style="margin-top:14px;">Section total isn't available yet — ask admin to run the ranking database update.</div>`;
      }
    }
    if(allDone && sets.length){
      html += `<div class="row" style="margin-top:8px;"><button class="subtle" id="fullTestBtn">📊 Review full test (all sections)</button></div>`;
    }
  }
  if(myToken !== navToken) return;
  document.getElementById('utabBody').innerHTML += html;
  wireSetRows();
  const ftBtn = document.getElementById('fullTestBtn');
  if(ftBtn) ftBtn.onclick = ()=> loadFullTestReview(folder.id);
}
function rankBadgeHtml(rankRow){
  if(rankRow && rankRow.rank){
    return `<div class="rankbadge">
      <div class="rankbadge-item"><div class="rankbadge-num">#${rankRow.rank}</div><div class="rankbadge-label">Rank of ${rankRow.total_attempts}</div></div>
      <div class="rankbadge-item"><div class="rankbadge-num">${rankRow.percentile}<span style="font-size:15px;">ᵗʰ</span></div><div class="rankbadge-label">Percentile</div></div>
    </div>
    <div class="muted" style="text-align:center;font-size:11.5px;margin-top:5px;">Updates as more people attempt</div>`;
  }
  return `<div class="rankbadge-empty">Not enough other attempts yet to rank against — check back later, this updates automatically.</div>`;
}
function setRow(s, isActive, locked=false, att=null, rankRow=null){
  const n = s.question_ids.length;
  let statsHtml = '';
  if(att){
    const row = rankRow;
    // Percentage is always computed straight from this attempt's own
    // correct/total — it no longer depends on the rank RPC returning data,
    // so it still shows even when there's only one attempt so far (no one
    // to rank/percentile against yet).
    const totalQ = att.total_questions ?? n;
    const pct = totalQ ? Math.round((att.correct_count||0)/totalQ*1000)/10 : null;
    statsHtml = `<div class="muted" style="font-size:12px;margin-top:3px;">
      ✅ ${att.correct_count ?? '—'}/${totalQ} correct (${pct!=null?pct+'%':'—'}) · score ${att.score>0?'+':''}${att.score}
      ${row && row.rank ? ` · rank ${row.rank}/${row.total_attempts} · ${row.percentile}ᵗʰ percentile` : ' · percentile: not enough attempts yet to compare'}
    </div>`;
  }
  return `<div class="qrow" style="flex-direction:column;align-items:stretch;gap:6px;cursor:default;">
    <div class="row" style="justify-content:space-between;">
      <div><b>Set ${s.set_number}</b> · ${n} questions · ${s.duration_minutes} min ${locked?'<span class="lockicon">🔒</span>':''}</div>
      <div class="row" style="gap:8px;">
        ${att?`<button class="subtle" data-reviewset="${s.id}">Review</button>`:''}
        ${att?`<button class="subtle" data-resetset="${s.id}" title="Wipe every attempt for this set and start completely fresh">Reset</button>`:''}
        <button class="${isActive&&!locked?'primary':'ghost'}" data-startset="${s.id}" ${(!isActive||locked)?'disabled':''}>${!isActive?'Locked':locked?'Complete previous':att?'Retake':'Start'}</button>
      </div>
    </div>
    ${statsHtml}
  </div>`;
}
function wireSetRows(){
  document.querySelectorAll('[data-startset]').forEach(b=>{
    b.onclick = ()=> startAttempt(b.dataset.startset);
  });
  document.querySelectorAll('[data-reviewset]').forEach(b=>{
    b.onclick = ()=> openReviewForSet(b.dataset.reviewset);
  });
  document.querySelectorAll('[data-resetset]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Reset this set? Every past attempt, score, and answer for it will be permanently deleted — this cannot be undone.')) return;
      b.disabled = true; b.textContent = 'Resetting…';
      const setId = b.dataset.resetset;
      const { error } = await sb.from('attempts').delete().eq('user_id', S.profile.id).eq('set_id', setId);
      if(error){ alert('Reset failed: ' + error.message); b.disabled = false; b.textContent = 'Reset'; return; }
      loadFolderSets(true);
    };
  });
}
async function openReviewForSet(setId){
  const { data: s } = await sb.from('sets').select('*').eq('id', setId).maybeSingle();
  const { data: att } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('set_id', setId).eq('status','submitted').order('submitted_at',{ascending:false}).limit(1).maybeSingle();
  if(!s || !att){ toast('No completed attempt to review yet'); return; }
  // Same reasoning as startAttempt: skip the (possibly large, embedded-base64)
  // image_url in this bulk fetch so review opens quickly; images are loaded
  // lazily per-question as you page through (see ensureQuestionImage).
  const { data: qs } = await sb.from('questions').select('id, q_text, options, correct_index, explanation, subject, is_controversial').in('id', s.question_ids);
  const questions = s.question_ids.map(id=>qs.find(q=>q.id===id)).filter(Boolean);
  // Community accuracy per question, fetched once for the whole set (not
  // per question) so paging through review stays instant.
  const { data: accStats } = await sb.rpc('question_accuracy_stats', { p_question_ids: questions.map(q=>q.id) });
  const accById = {}; (accStats||[]).forEach(a=>{ accById[a.question_id]=a; });
  questions.forEach(q=>{ q._acc = accById[q.id] || null; });
  goTo({ review:{ att, set: s, questions, showExpl:false } });
}
async function loadFullTestReview(folderId){
  const { data: sets } = await sb.from('sets').select('*').eq('folder_id', folderId).is('user_id', null).eq('set_type','main').order('set_number');
  let allQuestions = [], mergedAnswers = {}, totalScore = 0, totalCorrect = 0, totalQ = 0;
  for(const s of sets){
    const { data: att } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('set_id', s.id).eq('status','submitted').order('submitted_at',{ascending:false}).limit(1).maybeSingle();
    if(!att){ toast('Complete every section first'); return; }
    const { data: qs } = await sb.from('questions').select('id, q_text, options, correct_index, explanation, subject, is_controversial').in('id', s.question_ids);
    const ordered = s.question_ids.map(id=>qs.find(q=>q.id===id)).filter(Boolean);
    allQuestions = allQuestions.concat(ordered);
    Object.assign(mergedAnswers, att.answers);
    totalScore += (att.score||0); totalCorrect += (att.correct_count||0); totalQ += (att.total_questions||ordered.length);
  }
  const fakeAtt = { id:null, answers: mergedAnswers, score: totalScore, correct_count: totalCorrect, total_questions: totalQ };
  const { data: accStats } = await sb.rpc('question_accuracy_stats', { p_question_ids: allQuestions.map(q=>q.id) });
  const accById = {}; (accStats||[]).forEach(a=>{ accById[a.question_id]=a; });
  allQuestions.forEach(q=>{ q._acc = accById[q.id] || null; });
  goTo({ review:{ att: fakeAtt, set: {question_ids: allQuestions.map(q=>q.id)}, questions: allQuestions, showExpl:false } });
}

async function loadStatsTab(){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const start = new Date(); start.setHours(0,0,0,0);
  const weekStart = new Date(start); weekStart.setDate(weekStart.getDate()-6);

  // One query covers both "today" and the 7-day daily breakdown, using the
  // correct_count/total_questions already stored on each attempt at submit
  // time — no more per-attempt "look up every question again" loop, which
  // was what made this tab slow to open.
  const [{ data: weekAttempts }, pctRes] = await Promise.all([
    sb.from('attempts').select('correct_count, total_questions, submitted_at')
      .eq('user_id', S.profile.id).eq('status','submitted').gte('submitted_at', weekStart.toISOString()),
    sb.rpc('get_today_percentile'),
  ]);
  if(myToken !== navToken) return;
  const pct = pctRes.data && pctRes.data[0];

  const todayKey = start.toLocaleDateString('en-CA');
  const byDay = {};
  (weekAttempts||[]).forEach(a=>{
    const key = new Date(a.submitted_at).toLocaleDateString('en-CA');
    byDay[key] = byDay[key] || {attempted:0, correct:0};
    byDay[key].attempted += (a.total_questions||0);
    byDay[key].correct += (a.correct_count||0);
  });
  const today = byDay[todayKey] || {attempted:0, correct:0};
  const total = today.attempted, corrCount = today.correct, wrongCount = total - corrCount;

  const days = Object.keys(byDay).sort().reverse();
  let dailyHtml = `<div class="card"><h3>Daily stats (last 7 days)</h3>`;
  if(days.length){
    dailyHtml += days.map(d=>{
      const {attempted, correct} = byDay[d];
      const acc = attempted ? Math.round(correct/attempted*100) : 0;
      const label = d===todayKey ? 'Today' : new Date(d+'T00:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
      return `<div class="qrow" style="cursor:default;"><div><b>${label}</b> · ${attempted} q attempted</div><div class="muted">${correct}/${attempted||1} correct (${acc}%)</div></div>`;
    }).join('');
  } else {
    dailyHtml += `<div class="muted">No attempts in the last 7 days yet — this fills in as you complete sets.</div>`;
  }
  dailyHtml += `</div>`;

  if(myToken !== navToken) return;
  const havePct = pct && pct.percentile != null;
  const gaugeHtml = havePct ? `<div class="card" style="text-align:center;">
      <div class="muted" style="font-size:12px;letter-spacing:.03em;">HOW YOU'RE DOING TODAY</div>
      <div style="max-width:220px;margin:6px auto -18px;"><canvas id="pctGauge"></canvas></div>
      <div style="font-size:30px;font-weight:800;color:var(--amber);margin-top:4px;">${pct.percentile}<span style="font-size:16px;">th percentile</span></div>
      <div class="muted" style="margin-top:4px;">Better than ${pct.percentile}% of ${pct.users_compared} user${pct.users_compared===1?'':'s'} active today · your accuracy: ${Math.round(pct.my_accuracy)}%</div>
    </div>`
    : `<div class="card muted" style="text-align:center;">${total>0 ? 'Not enough other users active today yet to compare against.' : 'Attempt some questions today to see your percentile here.'}</div>`;

  document.getElementById('utabBody').innerHTML += gaugeHtml + `<div class="card"><h3>Today</h3>
    <div class="row" style="gap:26px;align-items:center;flex-wrap:wrap;">
      <div class="row" style="gap:26px;">
        <div><div class="stat-big">${total}</div><div class="muted">Attempted</div></div>
        <div><div class="stat-big" style="color:var(--green)">${corrCount}</div><div class="muted">Correct</div></div>
        <div><div class="stat-big" style="color:var(--red)">${wrongCount}</div><div class="muted">Wrong</div></div>
      </div>
      <div style="width:130px;height:130px;flex-shrink:0;">${total>0?'<canvas id="todayPieChart"></canvas>':''}</div>
    </div>
  </div>
  ${dailyHtml}
  <div class="card"><h3>Accuracy trend (last 7 days)</h3>
    <div style="height:200px;">${days.length?'<canvas id="accLineChart"></canvas>':'<div class="muted">No attempts in the last 7 days yet.</div>'}</div>
  </div>
  <div class="card"><h3>Questions per day</h3>
    <div style="height:220px;">${days.length?'<canvas id="weekBarChart"></canvas>':'<div class="muted">No attempts in the last 7 days yet.</div>'}</div>
  </div>`;

  // Chart.js instances get torn down and rebuilt every time this tab loads
  // (S._charts keeps the references) — otherwise re-opening the tab throws
  // "canvas already in use" since the old chart is still attached.
  S._charts = S._charts || {};
  Object.values(S._charts).forEach(c=>c?.destroy?.());
  S._charts = {};
  if(havePct){
    const ctx0 = document.getElementById('pctGauge');
    if(ctx0) S._charts.gauge = new Chart(ctx0, {
      type: 'doughnut',
      data: { datasets:[{ data:[pct.percentile, 100-pct.percentile], backgroundColor:['#efa53e','rgba(255,255,255,.08)'], borderWidth:0 }] },
      options: { rotation:-90, circumference:180, cutout:'75%', plugins:{ legend:{display:false}, tooltip:{enabled:false} } }
    });
  }
  if(total>0){
    const ctx = document.getElementById('todayPieChart');
    if(ctx) S._charts.today = new Chart(ctx, {
      type: 'doughnut',
      data: { labels:['Correct','Wrong'], datasets:[{ data:[corrCount, wrongCount], backgroundColor:['#30b87a','#f0525a'], borderColor:'#0e0e18', borderWidth:2 }] },
      options: { plugins:{ legend:{display:false} }, cutout:'68%' }
    });
  }
  if(days.length){
    const labels = days.slice().reverse().map(d=> d===todayKey ? 'Today' : new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}));
    const attemptedArr = days.slice().reverse().map(d=>byDay[d].attempted);
    const correctArr = days.slice().reverse().map(d=>byDay[d].correct);
    const accArr = days.slice().reverse().map(d=> byDay[d].attempted ? Math.round(byDay[d].correct/byDay[d].attempted*100) : 0);
    const ctxAcc = document.getElementById('accLineChart');
    if(ctxAcc) S._charts.acc = new Chart(ctxAcc, {
      type: 'line',
      data: { labels, datasets:[{ label:'Accuracy %', data:accArr, borderColor:'#efa53e', backgroundColor:'rgba(239,165,62,.18)', fill:true, tension:.35, pointBackgroundColor:'#efa53e', pointRadius:4 }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{
          x:{ ticks:{ color:'#9698b0' }, grid:{ color:'rgba(255,255,255,.06)' } },
          y:{ ticks:{ color:'#9698b0', callback:v=>v+'%' }, grid:{ color:'rgba(255,255,255,.06)' }, beginAtZero:true, max:100 }
        }
      }
    });
    const ctx2 = document.getElementById('weekBarChart');
    if(ctx2) S._charts.week = new Chart(ctx2, {
      type: 'bar',
      data: { labels, datasets:[
        { label:'Attempted', data:attemptedArr, backgroundColor:'#efa53e', borderRadius:6 },
        { label:'Correct', data:correctArr, backgroundColor:'#30b87a', borderRadius:6 },
      ]},
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#c9cbe0' } } },
        scales:{
          x:{ ticks:{ color:'#9698b0' }, grid:{ color:'rgba(255,255,255,.06)' } },
          y:{ ticks:{ color:'#9698b0' }, grid:{ color:'rgba(255,255,255,.06)' }, beginAtZero:true }
        }
      }
    });
  }
}

  cats.forEach(c=>{ const fid=c.questions.folder_id; byFolder[fid]=byFolder[fid]||{}; (byFolder[fid][c.category]=byFolder[fid][c.category]||[]).push(c.question_id); });
  // Batch-fetch every folder name in one round trip instead of one query

  const fids = Object.keys(byFolder);

async function startCategoryDeck(folderId, category){
  const { data: cats } = await sb.from('categorizations').select('question_id, questions!inner(folder_id, qbank_id)').eq('user_id', S.profile.id).eq('category', category).eq('questions.folder_id', folderId);

  const dur = Math.round(ids.length*0.9*10)/10;
  const { data: existing } = await sb.from('sets').select('*').eq('folder_id', folderId).eq('user_id', S.profile.id).eq('category', category).maybeSingle();

// ================= CUSTOM TEST BUILDER =================
// Lets a student assemble their own 50q/45min set from a filtered pool
// (platform, subject-wise/PYQ/GT/all, difficulty by community accuracy,
// and their own mistake-category tags), and share it with a short code that
// only other active users can redeem. See generateSetsForFolder's chunking
// for where the "leftover chunk gets 0.9 min/question" rule is mirrored here.
let ctState = { platform: '__all__', folders: [], sections: [], difficulty: 'all', category: 'all', numQuestions: 50, duration: 45 };
let ctFoldersCache = null; // { forPlatform, list } — avoids refetching folders on every chip toggle
async function getCtFolders(qbankId){
  if(ctFoldersCache && ctFoldersCache.forPlatform===qbankId) return ctFoldersCache.list;
  const list = await fetchAllRows(()=> qbankId==='__all__'
    ? sb.from('folders').select('id, name, exam_type, qbank_id')
    : sb.from('folders').select('id, name, exam_type, qbank_id').eq('qbank_id', qbankId));
  ctFoldersCache = { forPlatform: qbankId, list: list||[] };
  return ctFoldersCache.list;
}
function ctOptionSets(qbanks){
  return {
    platform: [{value:'__all__',label:'🌐 All platforms'}, ...qbanks.map(q=>({value:q.id,label:q.name}))],
    difficulty: [
      {value:'all',label:'⚪ All'},
      {value:'hard',label:'🔴 Hard — most people got it wrong'},
      {value:'medium',label:'🟡 Medium'},
      {value:'easy',label:'🟢 Easy — most people got it right'},
    ],
    category: [
      {value:'all',label:'🏷️ All (tagged or not, doesn\'t matter)'},
      {value:'none',label:'🆕 None — only questions I haven\'t tagged'},
      ...CATS.map(c=>({value:c.key,label:`${c.label} only`})),
    ],
  };
}
// Chip-style multi-select (folders / sections). selectedList is the actual
// ctState array — mutated in place so callers don't need to re-sync it.
function renderChipMultiSelect(id, options, selectedList){
  if(!options.length) return `<p class="muted" style="font-size:13px;">Nothing to pick here yet.</p>`;
  return `<div class="chipselect" id="${id}">
    ${options.map(o=>`<button type="button" class="chip ${selectedList.includes(o.value)?'chip-on':''}" data-v="${escapeHtml(String(o.value))}">${escapeHtml(o.label)}</button>`).join('')}
  </div>`;
}
function wireChipMultiSelect(id, selectedList, onChange){
  const el = document.getElementById(id);
  if(!el) return;
  el.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick = ()=>{
      const v = ch.dataset.v;
      const idx = selectedList.indexOf(v);
      if(idx>=0) selectedList.splice(idx,1); else selectedList.push(v);
      onChange && onChange();
    };
  });
}

    <p class="muted" style="font-size:12px;margin:-4px 0 8px;">Narrow further to specific sections inside the folders above. Multiple allowed.</p>
    ${renderChipMultiSelect('ctSectionChips', sectionCandidates.map(f=>({value:f.id,label:leafNameOf(f.name)})), ctState.sections)}

    <label style="margin-top:16px;">Difficulty (based on how everyone else has scored on it)</label>
    ${renderCselHtml('ctDifficultySel', opts.difficulty, ctState.difficulty)}
    <label>Your mistake-category tags</label>
    ${renderCselHtml('ctCategorySel', opts.category, ctState.category)}

    <div class="row" style="gap:12px;margin-top:16px;flex-wrap:wrap;">

  wireChipMultiSelect('ctFolderChips', ctState.folders, ()=>renderBuildCard(qbanks));
  wireChipMultiSelect('ctSectionChips', ctState.sections, ()=>renderBuildCard(qbanks));
  wireCsel('ctDifficultySel', opts.difficulty, ctState.difficulty, v=>{ ctState.difficulty=v; renderBuildCard(qbanks); });

  document.getElementById('ctNumQ').onchange = (e)=>{ ctState.numQuestions = Math.max(1, parseInt(e.target.value)||50); };
  document.getElementById('ctDuration').onchange = (e)=>{ ctState.duration = Math.max(1, parseFloat(e.target.value)||45); };

async function buildCustomSet(qbanks){
  const st = document.getElementById('ctStatus');
  const resultEl = document.getElementById('ctResult');
  resultEl.innerHTML = '';
  st.textContent = 'Building your set…';
  const qbankId = ctState.platform;
  const difficulty = ctState.difficulty;
  const category = ctState.category;
  const numQuestions = Math.max(1, ctState.numQuestions||50);
  const duration = Math.max(1, ctState.duration || Math.round(numQuestions*0.9*10)/10);

  const folders = await getCtFolders(qbankId);
  if(!folders || !folders.length){ st.textContent = 'No sections in this platform yet.'; return; }

  let targetFolders = folders;
  if(ctState.folders.length) targetFolders = targetFolders.filter(f=> ctState.folders.includes(folderGroupOf(f.name)));
  if(ctState.sections.length) targetFolders = targetFolders.filter(f=> ctState.sections.includes(f.id));
  if(!targetFolders.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  const qRows = await fetchAllRows(()=>sb.from('questions').select('id').in('folder_id', targetFolders.map(f=>f.id)));
  let candidateIds = qRows.map(q=>q.id);
  if(!candidateIds.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  // Mistake-category filter, scoped to this user's own tags only.
  if(category !== 'all'){
    const { data: myCats } = await sb.from('categorizations').select('question_id, category').eq('user_id', S.profile.id).in('question_id', candidateIds);
    const tagged = new Set((myCats||[]).map(c=>c.question_id));
    if(category==='none'){
      candidateIds = candidateIds.filter(id=>!tagged.has(id));
    } else {
      const withThisTag = new Set((myCats||[]).filter(c=>c.category===category).map(c=>c.question_id));
      candidateIds = candidateIds.filter(id=>withThisTag.has(id));
    }
  }
  if(!candidateIds.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  // Never repeat a question from a previous custom set built with this exact
  // same combination of filters (tracked via custom_filter_key on our own
  // past 'custom' sets — see the Supabase notes for why this needs no extra
  // tracking table).
  const filterKey = `${qbankId}|${ctState.folders.slice().sort().join(',')}|${ctState.sections.slice().sort().join(',')}|${difficulty}|${category}`;
  const { data: pastSets } = await sb.from('sets').select('question_ids').eq('user_id', S.profile.id).eq('set_type','custom').eq('custom_filter_key', filterKey);
  const usedBefore = new Set();
  (pastSets||[]).forEach(s=> (s.question_ids||[]).forEach(id=>usedBefore.add(id)));
  candidateIds = candidateIds.filter(id=>!usedBefore.has(id));
  if(!candidateIds.length){ alert('No questions available — you\'ve already used every question that matches this combination.'); st.textContent=''; return; }

  // Difficulty filter needs community-wide accuracy, which RLS keeps a
  // regular user from querying directly — routed through a SECURITY DEFINER
  // RPC (question_accuracy_stats) that only returns aggregate counts.
  if(difficulty !== 'all'){
    const { data: stats, error: statErr } = await sb.rpc('question_accuracy_stats', { p_question_ids: candidateIds });
    if(statErr){ st.textContent = 'Could not load difficulty stats: ' + statErr.message; return; }
    const byId = {}; (stats||[]).forEach(s=> byId[s.question_id]=s);
    candidateIds = candidateIds.filter(id=>{
      const s = byId[id];
      if(!s || !s.total_attempts) return false; // no data yet -> can't classify, excluded from Easy/Medium/Hard
      const acc = s.correct_attempts / s.total_attempts;
      if(difficulty==='hard') return acc <= 0.4;
      if(difficulty==='medium') return acc > 0.4 && acc <= 0.7;
      if(difficulty==='easy') return acc > 0.7;
      return true;
    });
  }
  if(!candidateIds.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  // Shuffle and take however many the user asked for; fewer available just
  // means a shorter set.
  for(let i=candidateIds.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidateIds[i],candidateIds[j]]=[candidateIds[j],candidateIds[i]]; }
  const picked = candidateIds.slice(0, numQuestions);

  const folderLabel = ctState.sections.length ? `${ctState.sections.length} section${ctState.sections.length>1?'s':''}`
    : ctState.folders.length ? ctState.folders.join(', ')
    : 'All folders';
  const diffLabel = {all:'All', hard:'Hard', medium:'Medium', easy:'Easy'}[difficulty];
  const catLabel = category==='all' ? 'All' : category==='none' ? 'None' : CATS.find(c=>c.key===category)?.label;
  const platformLabel = qbankId==='__all__' ? 'All platforms' : (qbanks.find(q=>q.id===qbankId)?.name || 'Platform');
  const label = `Custom: ${platformLabel} · ${folderLabel} · ${diffLabel} · ${catLabel}`;

  const ins = await sb.from('sets').insert({
    qbank_id: qbankId==='__all__' ? null : qbankId, folder_id: null, user_id: S.profile.id, set_type:'custom',
    subject: label, custom_filter_key: filterKey,
    question_ids: picked, duration_minutes: duration, set_number: 1
  }).select().maybeSingle();
  if(ins.error){ st.textContent = 'Could not create set: ' + ins.error.message; return; }

  st.textContent = picked.length < numQuestions ? `Only ${picked.length} matching questions were available (you asked for ${numQuestions}).` : '';
  resultEl.innerHTML = `<div class="qrow custom-set-row" style="cursor:default;">
    <div>✅ <b>${picked.length} questions</b> · ⏱️ ${duration} min</div>
    <div class="row"><button class="primary iconbtn" id="ctStart">▶ Start now</button><button class="subtle iconbtn" id="ctShare">🔗 Get share code</button></div>
  </div><div id="ctShareOut" class="muted" style="margin-top:8px;"></div>`;
  document.getElementById('ctStart').onclick = ()=>{
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal">${instructionsCardHtml({ title: label, totalQ: picked.length, totalMin: duration, setCount: 1, sequential: false })}</div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#startExamBtn').onclick = ()=>{ overlay.remove(); startAttempt(ins.data.id, ins.data); };
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  };
  document.getElementById('ctShare').onclick = async ()=>{
    const code = await ensureShareCode(ins.data.id);
    document.getElementById('ctShareOut').innerHTML = code
      ? `🔑 Share this code: <b style="font-family:var(--mono);font-size:16px;letter-spacing:.08em;">${code}</b>`

async function ensureShareCode(setId){
  // Retries on the rare chance of a code collision (share_code is UNIQUE).
  for(let attempt=0; attempt<5; attempt++){
    const code = Array.from({length:6}, ()=> '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*32)]).join('');
    const upd = await sb.from('sets').update({share_code:code}).eq('id', setId).select().maybeSingle();
    if(!upd.error) return upd.data.share_code;
  }
  return null;
}

async function redeemShareCode(){
  const st = document.getElementById('ctRedeemStatus');
  const code = document.getElementById('ctCode').value.trim().toUpperCase();
  if(!code){ st.textContent = 'Type a code first.'; return; }
  st.textContent = 'Looking up…';
  const { data, error } = await sb.rpc('redeem_share_code', { p_code: code });
  const row = Array.isArray(data) ? data[0] : data;
  if(error || !row){ st.textContent = 'Code not found.'; return; }
  st.textContent = '';
  startAttempt(row.id, row);
}

async function startAttempt(setId, presetSet){
  const set = presetSet || (await sb.from('sets').select('*').eq('id', setId).maybeSingle()).data;
  let { data: att } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('set_id', setId).eq('status','in_progress').maybeSingle();
  // Deliberately excludes image_url: some questions now carry embedded
  // base64 images (can be several hundred KB each), and pulling that for
  // every question in the set up front is what was making a set take so
  // long to open. Text loads instantly; each question's image is fetched
  // lazily (see ensureQuestionImage) only once you're actually viewing it.
  const { data: questions } = await sb.from('questions')
    .select('id, q_text, options, correct_index, explanation, subject, is_controversial')
    .in('id', set.question_ids);
  const ordered = set.question_ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean);
  if(!att){
    const initAnswers={}; ordered.forEach(q=>initAnswers[q.id]={selected:null,status:'not_visited'});
    const ins = await sb.from('attempts').insert({user_id:S.profile.id, set_id:setId, answers:initAnswers}).select().maybeSingle();
    att = ins.data;
  }
  const elapsedSec = Math.floor((Date.now()-new Date(att.started_at).getTime())/1000);
  const totalSec = Math.round(set.duration_minutes*60);
  if(elapsedSec >= totalSec){ await submitAttempt(att, set, ordered, true); return; }
  goTo({ exam:{ set, att, questions:ordered, idx:0, totalSec, elapsedAtLoad:elapsedSec }, view:'exam' });
  startTimer();
}
// Fetches a single question's image_url on demand (undefined = not fetched
// yet, null = fetched and confirmed there isn't one). Calls onLoaded() once
// it arrives so the caller can re-render if the user is still looking at
// this exact question — used from both the exam player and review screens.
function ensureQuestionImage(q, onLoaded){
  if(q.image_url !== undefined || q._imgFetching) return;
  q._imgFetching = true;
  sb.from('questions').select('image_url').eq('id', q.id).maybeSingle().then(({data})=>{
    q.image_url = data ? data.image_url : null;
    q._imgFetching = false;
    if(onLoaded) onLoaded();
  });
}
let timerHandle=null;
function startTimer(){
  clearInterval(timerHandle);
  const t0 = Date.now();
  timerHandle = setInterval(()=>{
    const elapsed = S.exam.elapsedAtLoad + Math.floor((Date.now()-t0)/1000);
    const remain = S.exam.totalSec - elapsed;
    const el = document.getElementById('examTimer');
    if(el) el.textContent = fmtTime(remain);
    const ring = document.getElementById('examTimerRing');
    if(ring){
      const pct = Math.max(0, Math.min(100, (remain/S.exam.totalSec)*100));
      ring.style.setProperty('--pct', pct);
      ring.classList.toggle('low', remain<=300);
    }
    if(remain<=0){ clearInterval(timerHandle); submitAttempt(S.exam.att, S.exam.set, S.exam.questions, true); }
  },1000);
}

    const a=att.answers[q.id];
    if(a && (a.status==='answered'||a.status==='answered_marked')){
      const wasCorrect = a.selected===q.correct_index;
      if(wasCorrect){ score+=4; correctCount++; } else { score-=1; }
      statPairs.push({ questionId: q.id, wasCorrect });
    }
  }
  await sb.from('attempts').update({answers:att.answers, status:'submitted', submitted_at:new Date().toISOString(), score, correct_count:correctCount, total_questions:qs.length}).eq('id', att.id);
  bumpQuestionStats(statPairs).catch(e=>console.error('question stats update failed', e));
  att.status='submitted'; att.score=score;
  S.exam = null;
  S.review = { att, set, questions, showExpl:false };
  showCompletionAnim(auto ? 'Time up — set auto-submitted' : 'Set completed! 🎉', renderReviewChoice);
}

// Lets a student flag that they think the marked answer is wrong right from
// the review screen. Stored in the `question_queries` table (question_id,

async function openQueryModal(q, a){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal querymodal">
    <div class="rankmodal-head querymodal-head">
      <div class="rankmodal-icon querymodal-icon">🤔</div>

      <button class="modal-x" id="qmClose" title="Close">✕</button>
    </div>
    <div id="qmBody" class="muted">Loading…</div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('qmClose').onclick = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  const body = document.getElementById('qmBody');
  const { data: existing, error } = await sb.from('question_queries').select('*').eq('question_id', q.id).eq('user_id', S.profile.id).order('created_at',{ascending:false}).limit(1).maybeSingle();

  if(error){
    body.innerHTML = `<p style="color:var(--red);">Couldn't load — ${error.message}. Make sure the question_queries table has been set up in Firestore.</p>`;
    return;
  }
  if(existing && existing.status==='pending'){
    body.innerHTML = `<p>You've already raised a query on this question — it's <b>pending review</b> by the admin.</p>
      <div class="card muted" style="margin-top:10px;">"${escapeHtml(existing.query_text||'')}"</div>`;
    return;
  }
  if(existing && existing.status==='resolved'){
    body.innerHTML = `<p>✅ Your earlier query on this question was <b>accepted</b> — the correct answer was updated.</p>`;
    return;
  }
  if(existing && existing.status==='dismissed'){
    body.innerHTML = `<p>Your earlier query on this question was reviewed by the admin and the answer was kept as-is.${existing.admin_note?`<br><span class="muted">Admin note: ${escapeHtml(existing.admin_note)}</span>`:''}</p>
      <button class="subtle iconbtn" id="qmRaiseAgain" style="margin-top:10px;width:100%;">Raise a new query anyway</button>`;
    document.getElementById('qmRaiseAgain').onclick = ()=> renderQueryForm(body, q, a);
    return;
  }
  renderQueryForm(body, q, a);
}
function renderQueryForm(body, q, a){
  body.innerHTML = `
    <div class="muted" style="margin-bottom:8px;">What do you think is the correct answer?</div>
    <div id="qmOpts"></div>

    <div id="qmStatus" class="muted" style="margin-top:8px;"></div>`;

  optsEl.innerHTML = q.options.map((o,idx)=>`<div class="opt qm-opt" data-idx="${idx}">${renderRichText(o)}</div>`).join('');

    const text = document.getElementById('qmText').value.trim();

      suggested_correct_index: picked,
      query_text: text, status: 'pending'

    if(error){ st.textContent = 'Could not submit — ' + error.message; return; }
    body.innerHTML = `<p>✅ Query submitted — the admin will review it.</p>`;
  };
}
async function captureShot(withExpl){
  const node=document.getElementById('revCapture');
  const explDiv = node.querySelector('.divider')?.nextElementSibling;
  const dividerEl = node.querySelector('.divider');
  let hid=false;
  if(!withExpl && dividerEl){ dividerEl.style.display='none'; if(explDiv) explDiv.style.display='none'; hid=true; }
  let canvas;
  try{
    canvas = await html2canvas(node, {backgroundColor:'#141B2E', useCORS:true, imageTimeout:15000});
  }catch(err){
    // Cross-origin question images without permissive CORS headers can
    // "taint" the canvas and make html2canvas throw when it tries to read
    // pixel data back out. Fall back to a version without useCORS so the
    // rest of the screenshot (text, options) still gets saved rather than
    // failing completely.
    try{
      canvas = await html2canvas(node, {backgroundColor:'#141B2E'});
      toast('Saved, but the image couldn\'t be captured (host doesn\'t allow it)');
    }catch(err2){
      if(hid){ dividerEl.style.display=''; if(explDiv) explDiv.style.display=''; }
      toast('Screenshot failed — try again');
      return;
    }
  }
  if(hid){ dividerEl.style.display=''; if(explDiv) explDiv.style.display=''; }
  const link=document.createElement('a');
  link.download = 'question_'+Date.now()+'.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('Image saved to downloads');
}

function prettifyName(filename){
  let n = filename.replace(/\.(ndjson|json|txt)$/i,'');
  n = n.replace(/[_-]+/g,' ').trim();
  return n.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}

      }
      files = files.filter(f=>!/\.zip$/i.test(f.name)).concat(expanded);
      st.textContent = `Zip(s) expanded to ${expanded.length} file(s). Reading…`;
    }

    let explicitQbankId = null;
    if(qbSel.value==='__new__'){
      const name = document.getElementById('newQbName').value.trim();
      if(name){
        const { data: qb, error } = await sb.from('qbanks').insert({name}).select().maybeSingle();
        if(error){ st.textContent='Error creating qbank: '+error.message; return; }
        explicitQbankId = qb.id;
      }
      // else: leave null — each file below will auto-detect its platform
      // (BTR / Prepladder / ...) from its own filename and route itself,
      // reusing an existing qbank of that name instead of duplicating it.
    } else {
      explicitQbankId = qbSel.value;
    }

    // Folder / Subfolder / Subject typed here apply to every file in this
    // batch, and decide where they land in the Sections nav — "Tests" +
    // "Subject Test" + "Anatomy" -> a folder named "Tests - Subject Test -
    // Anatomy". Leaving Subfolder/Subject blank falls back to the old
    // 1-2 level behaviour.
    const topicVal = document.getElementById('qbTopic').value.trim();
    const subtopicVal = document.getElementById('qbSubtopic').value.trim();
    const subjectVal = document.getElementById('qbSubject').value.trim();
    const manualFolderName = [topicVal, subtopicVal, subjectVal].filter(Boolean).join(' - ') || null;

    // Upload any picked image files to Supabase Storage first, and build a
    // {lowercased original filename -> public URL} map.
    let imageMap = {};
    const imageFiles = [...(document.getElementById('qbImages').files||[])];
    const errors = [];
    if(imageFiles.length){
      st.textContent = `Uploading images… 0/${imageFiles.length}`;
      let done=0;
      for(const img of imageFiles){
        const safeName = img.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path = `q-images/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName}`;
        const { error: upErr } = await sb.storage.from('question-images').upload(path, img, {upsert:false, contentType: img.type||undefined});
        if(upErr){ errors.push(`Image "${img.name}": upload failed — ${upErr.message}.`); }
        else { const { data: pub } = sb.storage.from('question-images').getPublicUrl(path); imageMap[img.name.trim().toLowerCase()] = pub.publicUrl; }
        done++; st.textContent = `Uploading images… ${done}/${imageFiles.length}`;
      }
    }

    // ---- Pass 1: read every file and aggregate GLOBALLY by (qbank, folder
    // name) — never per-file. This is what guarantees one section's rows
    // never end up split across two separate uploads-in-a-row (which used
    // to mean only the first part got its sets built), no matter how many
    // files/zip-chunks a section's data happens to arrive in. ----
    const groups = new Map(); // `${qbankId}::${folderName}` -> {qbankId, qbankLabel, folderName, rows:[]}
    const qbankCache = new Map();
    let totalRows = 0;
    for(let fi=0; fi<files.length; fi++){
      const file = files[fi];
      st.textContent = `Reading files… ${fi+1}/${files.length} (${file.name})`;
      try{
        const text = await file.text();
        let rows=[];
        try{ const parsed=JSON.parse(text); rows = Array.isArray(parsed)?parsed:[parsed]; }
        catch(e){ rows = text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ try{return JSON.parse(l);}catch(_){return null;} }).filter(Boolean); }
        if(!rows.length){ errors.push(`${file.name}: could not parse any questions — skipped.`); continue; }

        let qbankId = explicitQbankId, qbankLabel = '';
        if(!qbankId){
          const platform = detectPlatformName(rows[0].platform || file.name);
          if(!platform){ errors.push(`${file.name}: no qbank selected, and couldn't auto-detect a platform from the filename — skipped.`); continue; }
          const cacheKey = platform.toLowerCase();
          if(qbankCache.has(cacheKey)){ const c=qbankCache.get(cacheKey); qbankId=c.id; qbankLabel=c.name; }
          else {
            const { data: existingQb } = await sb.from('qbanks').select('*').ilike('name', platform).maybeSingle();
            if(existingQb){ qbankId = existingQb.id; qbankLabel = existingQb.name; }
            else {
              const { data: newQb, error } = await sb.from('qbanks').insert({name:platform}).select().maybeSingle();
              if(error){ errors.push(`${file.name}: error creating qbank "${platform}" — ${error.message}`); continue; }
              qbankId = newQb.id; qbankLabel = newQb.name;
            }
            qbankCache.set(cacheKey, {id:qbankId, name:qbankLabel});
          }
        }

        rows.forEach(r=>{
          const folderName = r.folder || file._zipDir || manualFolderName || prettifyName(file.name);
          const key = `${qbankId}::${folderName}`;
          if(!groups.has(key)) groups.set(key, {qbankId, qbankLabel, folderName, rows:[]});
          groups.get(key).rows.push(r);
          totalRows++;
        });
      }catch(err){
        errors.push(`${file.name}: unexpected error while reading — ${err?.message||err}`);
      }
    }

    if(!groups.size){
      st.textContent = (errors.length ? errors.join('\n')+'\n\n' : '') + 'Nothing to upload.';
      return;
    }

    // ---- Pass 2: fetch every existing section for the qbank(s) involved
    // ONCE (fully paginated — this is what a bare .select() used to get
    // silently capped at ~1000 rows on, e.g. Marrow's 3,599 sections),
    // then bulk-create whatever's missing in large batches instead of one
    // insert per section. ----
    st.textContent = 'Checking existing sections…';
    const qbankIds = [...new Set([...groups.values()].map(g=>g.qbankId))];
    const existingFolderMap = new Map(); // `${qbankId}::${name}` -> folder row
    for(const qbId of qbankIds){
      const existing = await fetchAllRows(()=>sb.from('folders').select('*').eq('qbank_id', qbId));
      existing.forEach(f=> existingFolderMap.set(`${f.qbank_id}::${f.name}`, f));
    }

    const toCreate = [];
    for(const [key, g] of groups){
      if(!existingFolderMap.has(key)){
        const r0 = g.rows[0];
        const explicitType = r0.exam_type && EXAM_CONFIG[r0.exam_type] ? r0.exam_type : null;
        const detection = explicitType ? {type:explicitType} : autoDetectExamType(g.folderName);
        toCreate.push({ qbank_id: g.qbankId, name: g.folderName, exam_type: detection.type });
      }
    }
    const CREATE_CHUNK = 300;
    for(let i=0; i<toCreate.length; i+=CREATE_CHUNK){
      const chunk = toCreate.slice(i, i+CREATE_CHUNK);
      st.textContent = `Creating sections… ${Math.min(i+CREATE_CHUNK,toCreate.length)}/${toCreate.length}`;
      const { data: inserted, error } = await sb.from('folders').insert(chunk).select();
      if(error){ errors.push(`Couldn't create a batch of ${chunk.length} section(s): ${error.message}`); continue; }
      (inserted||[]).forEach(f=> existingFolderMap.set(`${f.qbank_id}::${f.name}`, f));
    }

    // ---- Pass 3: insert every group's questions, one folder at a time,
    // isolated in its own try/catch with one retry — a bad batch for one
    // section can no longer take out every section after it in the same
    // file. Progress shown as a single running percentage of total
    // questions instead of a line per file. ----
    let doneRows = 0;
    const touched = []; // folders that got new rows or need pattern (re)assignment
    for(const [key, g] of groups){
      const folder = existingFolderMap.get(key);
      if(!folder){ errors.push(`"${g.folderName}": section wasn't created — its ${g.rows.length} question(s) were skipped.`); doneRows += g.rows.length; continue; }
      const r0 = g.rows[0];
      const explicitType = r0.exam_type && EXAM_CONFIG[r0.exam_type] ? r0.exam_type : null;
      const detection = explicitType ? {type:explicitType, subject:r0.subject||null} : autoDetectExamType(g.folderName);

      let insertedCount = 0, lastErr = null;
      for(let attempt=1; attempt<=2 && insertedCount<g.rows.length; attempt++){
        try{
          const { count } = await sb.from('questions').select('id', {count:'exact', head:true}).eq('folder_id', folder.id);
          const baseIndex = count||0;
          const payload = g.rows.slice(insertedCount).map((r,i)=>({
            qbank_id: g.qbankId,
            folder_id: folder.id,
            q_text: resolveInlineImages(r.question||r.q_text||r.q||'', imageMap),
            options: (r.options||r.opts||[]).map(o=>resolveInlineImages(o, imageMap)),
            correct_index: typeof r.answer==='number'?r.answer: typeof r.correct_index==='number'?r.correct_index: letterToIndex(r.answer||r.correct),
            explanation: resolveInlineImages(r.explanation||r.expl||'', imageMap),
            image_url: resolveImageField(r.image_url||r.image||null, imageMap),
            subject: r.subject || detection.subject || g.folderName,
            order_index: baseIndex + i,
          })).filter(q=>q.q_text && q.options?.length);

          const CHUNK = 500;
          for(let start=0; start<payload.length; start+=CHUNK){
            const chunk = payload.slice(start, start+CHUNK);
            const { error: insErr } = await sb.from('questions').insert(chunk);
            if(insErr) throw insErr;
            insertedCount += chunk.length;
            doneRows += chunk.length;
            const pct = totalRows ? Math.round((doneRows/totalRows)*100) : 100;
            st.textContent = `Uploading questions… ${pct}% (${doneRows.toLocaleString()} / ${totalRows.toLocaleString()})`;
          }
          lastErr = null;
        }catch(err){
          lastErr = err;
          if(attempt<2) await new Promise(res=>setTimeout(res, 900)); // one short retry after a brief pause
        }
      }
      if(lastErr){
        const missed = g.rows.length - insertedCount;
        errors.push(`"${g.folderName}": stopped after ${insertedCount}/${g.rows.length} questions — ${lastErr.message||lastErr}`);
        doneRows += missed;
        const pct = totalRows ? Math.round((doneRows/totalRows)*100) : 100;
        st.textContent = `Uploading questions… ${pct}% (${doneRows.toLocaleString()} / ${totalRows.toLocaleString()})`;
      }
      if(insertedCount>0 || !folder.exam_type || (explicitType && folder.exam_type!==explicitType)){
        touched.push({ folder, detection, explicitType });
      }
    }

    // ---- Pass 4: (re)build sets for every touched section, isolated the
    // same way, with its own percentage. ----
    let setsDone = 0;
    for(const {folder, detection, explicitType} of touched){
      try{
        const patternIsStale = explicitType && folder.exam_type !== explicitType;
        if(!folder.exam_type || patternIsStale){
          await sb.from('folders').update({exam_type:detection.type}).eq('id', folder.id);
          folder.exam_type = detection.type;
        }
        await generateSetsForFolder(folder);
      }catch(err){
        errors.push(`"${folder.name}": couldn't generate sets — ${err?.message||err}`);
      }
      setsDone++;
      st.textContent = `Generating sets… ${setsDone}/${touched.length}`;
    }

    const parts = [`Done — ${groups.size.toLocaleString()} section(s), ${doneRows.toLocaleString()} question(s) uploaded.`];
    if(errors.length) parts.push(`\n${errors.length} issue(s):`, ...errors.slice(0,40), errors.length>40?`…and ${errors.length-40} more.`:'');
    st.textContent = parts.filter(Boolean).join('\n');
    document.getElementById('qbFiles').value='';
    document.getElementById('qbImages').value='';

    }finally{
      window.removeEventListener('beforeunload', warnBeforeUnload);
      document.removeEventListener('visibilitychange', reacquireWakeLock);
      try{ await wakeLock?.release(); }catch(_){}
    }
  };
}
function letterToIndex(v){
  if(v==null) return 0;
  if(typeof v==='number') return v;
  const m={A:0,B:1,C:2,D:3}; return m[String(v).trim().toUpperCase()] ?? 0;
}

async function adminFolders(){
  const body=document.getElementById('atabBody');
  const { data: qbanks } = await sb.from('qbanks').select('*').order('created_at',{ascending:false});
  if(!qbanks || !qbanks.length){ body.innerHTML = `<div class="card muted">No qbanks uploaded yet — go to the Upload tab first.</div>`; return; }
  S.adminQbSel = S.adminQbSel || qbanks[0].id;
  body.innerHTML = `<div class="card">
    <h3>Assign exam pattern per section</h3>
    <p class="muted">Pick a qbank, a category, tick one or more sections, choose the pattern, then generate. Re-generating replaces existing shared sets for the selected sections.</p>
    <label>QBank</label>
    <div style="display:flex; gap:8px; align-items:flex-end;">
      <select id="qbPick" style="flex:1;">${qbanks.map(qb=>`<option value="${qb.id}" ${qb.id===S.adminQbSel?'selected':''}>${qb.name}</option>`).join('')}</select>

      <option value="neetpg">NEET PG pattern (5×40 q, 42 min, sequential)</option>
      <option value="updated_neetpg">Updated NEET PG (5×36 q, 42 min, sequential)</option>
      <option value="custom">Custom — you choose questions/set &amp; minutes</option>
    </select>
    <div id="customPatternWrap" style="display:none;">
      <div class="row">
        <div style="flex:1;"><label>Questions per set (0 = one set, all questions)</label><input type="number" id="customPerSet" min="0" value="50"></div>
        <div style="flex:1;"><label>Minutes per full set</label><input type="number" id="customMinutes" min="1" value="45"></div>
      </div>
    </div>
    <button class="primary" id="genSets" style="margin-top:14px;">Generate sets for selected sections</button>
    <div id="genStatus" class="muted" style="margin-top:8px; white-space:pre-line;"></div>
  </div>`;
  document.getElementById('qbPick').onchange = (e)=>{ S.adminQbSel = e.target.value; S.adminCategory = null; adminFolders(); };
  document.getElementById('examTypeSel').onchange = (e)=>{
    document.getElementById('customPatternWrap').style.display = e.target.value==='custom' ? 'block' : 'none';
  };
  document.getElementById('delQbankBtn').onclick = async ()=>{
    const qbId = document.getElementById('qbPick').value;
    const qb = qbanks.find(q=>q.id===qbId);
    if(!qb) return;
    const typed = prompt(`This permanently deletes the qbank "${qb.name}" and every section, question, and user attempt inside it. This cannot be undone.\n\nType the qbank name exactly to confirm:`);
    if(typed !== qb.name){ if(typed !== null) alert('Name did not match — nothing was deleted.'); return; }
    const btn = document.getElementById('delQbankBtn');
    btn.disabled = true;
    try{
      btn.textContent = 'Deleting… fetching sections';
      const folders = await fetchAllRows(()=>sb.from('folders').select('id').eq('qbank_id', qbId));
      const folderIds = folders.map(f=>f.id);
      // A qbank with 100k+ questions across thousands of sections can't be
      // deleted in one shot — a single cascading DELETE that size runs into
      // Postgres's statement timeout and fails outright, leaving everything
      // in place ("Delete failed: canceling statement due to statement
      // timeout"). Deleting a batch of sections' worth of rows at a time
      // (attempts, then sets, then questions, then the folders themselves)
      // keeps every individual statement small enough to always complete.
      const CHUNK = 40;
      for(let i=0; i<folderIds.length; i+=CHUNK){
        const chunk = folderIds.slice(i, i+CHUNK);
        btn.textContent = `Deleting… sections ${i+1}-${Math.min(i+CHUNK,folderIds.length)} of ${folderIds.length}`;
        const { data: setsInChunk } = await sb.from('sets').select('id').in('folder_id', chunk);
        const setIds = (setsInChunk||[]).map(s=>s.id);
        for(let j=0; j<setIds.length; j+=200){
          await sb.from('attempts').delete().in('set_id', setIds.slice(j, j+200));
        }
        await sb.from('sets').delete().in('folder_id', chunk);
        await sb.from('questions').delete().in('folder_id', chunk);
        await sb.from('folders').delete().in('id', chunk);
      }
      btn.textContent = 'Deleting… finishing up';
      const { error } = await sb.from('qbanks').delete().eq('id', qbId);
      if(error) throw error;
    }catch(err){
      alert('Delete failed: ' + (err?.message || err));
      btn.disabled = false; btn.textContent = 'Delete this qbank';
      return;
    }
    S.adminQbSel = null;
    adminFolders();
  };
  await renderFolderList();

  document.getElementById('genSets').onclick = async ()=>{
    const ids = [...document.querySelectorAll('.folderChk:checked')].map(c=>c.value);
    const type = document.getElementById('examTypeSel').value;
    const st=document.getElementById('genStatus');
    if(!ids.length){ st.textContent='Select at least one section.'; return; }
    let customPerSet = null, customMinutes = null;
    if(type==='custom'){
      const rawPerSet = parseInt(document.getElementById('customPerSet').value, 10);
      customPerSet = (Number.isFinite(rawPerSet) && rawPerSet>0) ? rawPerSet : null; // null/0 = one set, no split
      customMinutes = parseFloat(document.getElementById('customMinutes').value) || 45;
    }
    let log=[];
    for(const folderId of ids){
      const { data: folderRow } = await sb.from('folders').select('*').eq('id', folderId).maybeSingle();
      const patch = type==='custom' ? {exam_type:type, custom_per_set:customPerSet, custom_minutes:customMinutes} : {exam_type:type};
      await sb.from('folders').update(patch).eq('id', folderId);
      const folder = {...folderRow, ...patch};
      const n = await generateSetsForFolder(folder);
      log.push(`${folder.name}: ${n} sets generated.`);
      st.textContent = log.join('\n');
    }
    st.textContent = log.join('\n') + '\n\nDone.';
    renderFolderList();
  };
}
// Level 1 inside admin's "Sections" tab: a category picker (Subject-wise /
// Tests / GT / NEET PG / INICET), computed client-side from a single
// id+name+exam_type fetch (no counts). Only the folders in the *selected*
// category then get their question-count queried — same fix as the
// user-facing nav, applied here too, since this screen used to blast a
// count query for every section in the whole qbank at once.

  const el = document.getElementById('folderList');

  const byCat = {};
  allFolders.forEach(f=>{ const c=categoryOf(f); (byCat[c]=byCat[c]||[]).push(f); });
  Object.values(byCat).forEach(list=>list.sort((a,b)=>naturalCompare(leafNameOf(a.name), leafNameOf(b.name))));
  const cats = CATEGORY_ORDER.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CATEGORY_ORDER.includes(c)));
  if(!S.adminCategory || !byCat[S.adminCategory]) S.adminCategory = cats[0];

  el.innerHTML = `<div class="row" style="margin-bottom:10px;">
      <select id="adminCatSel" style="max-width:240px;">
        ${cats.map(c=>`<option value="${c}" ${c===S.adminCategory?'selected':''}>${c} (${byCat[c].length})</option>`).join('')}
      </select>
    </div><div id="folderChecklistWrap" class="muted">Loading…</div>`;
  document.getElementById('adminCatSel').onchange = (e)=>{ S.adminCategory = e.target.value; renderFolderList(); };

  const wrap = document.getElementById('folderChecklistWrap');
  const folders = byCat[S.adminCategory];
  const countMap = await countsByFolder(folders.map(f=>f.id));
  folders.forEach(f=>{ f._count = countMap[f.id]||0; });
  if(document.getElementById('adminCatSel') && document.getElementById('adminCatSel').value !== S.adminCategory) return; // stale, a newer category was picked meanwhile

  function groupOf(name){ return subGroupOf(name); }
  const groups = [...new Set(folders.map(f=>groupOf(f.name)))].sort();

  function renderChecklist(filterGroup){
    const visible = folders.filter(f=> filterGroup==='__all__' || groupOf(f.name)===filterGroup);
    let html = '';
    if(groups.length>1){
      html += `<div class="row" style="margin-bottom:10px;">
        <select id="folderGroupSelAdmin" style="max-width:260px;">
          <option value="__all__">All in ${S.adminCategory} (${folders.length})</option>
          ${groups.map(g=>{
            const n = folders.filter(f=>groupOf(f.name)===g).length;
            return `<option value="${g}" ${g===filterGroup?'selected':''}>${g} (${n})</option>`;
          }).join('')}
        </select>
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;margin:0;">
          <input type="checkbox" id="folderChkAll" style="width:auto;"> Select all shown</label>
      </div>`;
    } else {
      html += `<div class="row" style="margin-bottom:10px;">
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;margin:0;">
          <input type="checkbox" id="folderChkAll" style="width:auto;"> Select all shown</label>
      </div>`;
    }
    html += `<div id="folderChecklistItems">`;
    for(const f of visible){
      const cfg = EXAM_CONFIG[f.exam_type];
      const patternLabel = f.exam_type==='custom' ? `Custom (${f.custom_per_set||'all'} q/set, ${f.custom_minutes||45} min)` : (cfg?cfg.label:'not set');
      html += `<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--text);margin:8px 0;">
        <input type="checkbox" value="${f.id}" class="folderChk" style="width:auto;"> ${leafNameOf(f.name)} <span class="muted">(${f._count||0} questions — currently: ${patternLabel})</span></label>`;
    }
    html += `</div>`;
    wrap.innerHTML = html;
    const sel = document.getElementById('folderGroupSelAdmin');
    if(sel) sel.onchange = (e)=> renderChecklist(e.target.value);
    document.getElementById('folderChkAll').onchange = (e)=>{
      document.querySelectorAll('.folderChk').forEach(c=> c.checked = e.target.checked);
    };
  }
  renderChecklist(groups.length===1 ? groups[0] : '__all__');
}
function chunkToSets(ids, perSet, fullMinutes, subject){
  // perSet:null means "topic-wise" — never split, one set holds every
  // question in the folder, duration is always 0.9 min/question.
  if(perSet == null){
    if(!ids.length) return [];
    const duration = Math.round(ids.length*0.9*10)/10;
    return [{set_number:1, set_type:'main', subject, question_ids:ids, duration_minutes:duration}];
  }
  const out=[]; let setNum=1;
  for(let i=0;i<ids.length;i+=perSet){
    const chunk = ids.slice(i, i+perSet);
    const duration = chunk.length===perSet ? fullMinutes : Math.round(chunk.length*0.9*10)/10;
    out.push({set_number:setNum++, set_type:'main', subject, question_ids:chunk, duration_minutes:duration});
  }
  return out;
}
// Shared by the manual "Generate sets" button (Sections tab) and by the
// auto-generation that runs right after upload. Wipes existing shared
// (user_id is null) sets for the folder and rebuilds them from whatever
// exam_type is currently set on the folder.
async function generateSetsForFolder(folder){
  const type = folder.exam_type;
  const cfg = type==='custom'
    ? { perSet: folder.custom_per_set ?? null, minutesPerFull: folder.custom_minutes || 45, sequential:false }
    : EXAM_CONFIG[type];
  if(!type || !cfg) return 0;
  await sb.from('sets').delete().eq('folder_id', folder.id).is('user_id', null);
  const qs = await fetchAllRows(()=>sb.from('questions').select('id, subject').eq('folder_id', folder.id).order('order_index'));
  let setsToInsert = [];
  if(type==='subjectwise'){
    const bySubject={};
    (qs||[]).forEach(q=>{ (bySubject[q.subject||folder.name]=bySubject[q.subject||folder.name]||[]).push(q.id); });
    for(const subj in bySubject){
      setsToInsert = setsToInsert.concat(chunkToSets(bySubject[subj], cfg.perSet, cfg.minutesPerFull, subj));
    }
  } else {
    setsToInsert = chunkToSets((qs||[]).map(q=>q.id), cfg.perSet, cfg.minutesPerFull, null);
  }
  if(setsToInsert.length){
    await sb.from('sets').insert(setsToInsert.map(s=>({...s, qbank_id:folder.qbank_id, folder_id:folder.id})));
  }
  return setsToInsert.length;
}

// Populates the "Inside folder" dropdown on the section-creation card with

async function renderDelSecFolders(){
  const qbSel = document.getElementById('delSecQbPick');
  const sel = document.getElementById('delSecPick');
  if(!sel) return;
  const qbId = qbSel.value;
  const folders = await fetchAllRows(()=>sb.from('folders').select('id, name').eq('qbank_id', qbId));

async function renderDelSecCounts(){

  const secId = document.getElementById('delSecPick').value;
  if(!secId){ el.textContent = ''; return; }
  el.textContent = 'Checking what\'s inside…';
  const [{ count: qCount }, { count: sCount }] = await Promise.all([
    sb.from('questions').select('id', {count:'exact', head:true}).eq('folder_id', secId),
    sb.from('sets').select('id', {count:'exact', head:true}).eq('folder_id', secId),
  ]);
  el.textContent = `Contains ${qCount ?? 0} question(s) and ${sCount ?? 0} set(s).`;

async function doDeleteSection(){
  const secId = document.getElementById('delSecPick').value;
  const folder = (window._delSecFolders||[]).find(f=>f.id===secId);
  if(!folder) return;
  const typed = prompt(`This permanently deletes the section "${folder.name}" and every question, set, and user attempt inside it. This cannot be undone.\n\nType the section name exactly to confirm:`);
  if(typed !== folder.name){ if(typed !== null) alert('Name did not match — nothing was deleted.'); return; }
  const btn = document.getElementById('delSecBtn');
  btn.disabled = true; btn.textContent = 'Deleting…';
  try{
    const { data: setsInFolder } = await sb.from('sets').select('id').eq('folder_id', secId);
    const setIds = (setsInFolder||[]).map(s=>s.id);
    for(let j=0; j<setIds.length; j+=200){
      await sb.from('attempts').delete().in('set_id', setIds.slice(j, j+200));
    }
    await sb.from('sets').delete().eq('folder_id', secId);
    await sb.from('questions').delete().eq('folder_id', secId);
    const { error } = await sb.from('folders').delete().eq('id', secId);
    if(error) throw error;
  }catch(err){
    alert('Delete failed: ' + (err?.message || err));
    btn.disabled = false; btn.textContent = 'Delete this section';
    return;
  }
  document.getElementById('delSecStatus').textContent = `"${folder.name}" deleted.`;
  btn.disabled = false; btn.textContent = 'Delete this section';
  await renderDelSecFolders();
}

async function doMoveSections(qbanks){
  const ids = [...document.querySelectorAll('.mgChk:checked')].map(c=>c.value);
  const st = document.getElementById('mgMoveStatus');
  if(!ids.length){ st.textContent = 'Select at least one section.'; return; }
  let targetId = document.getElementById('mgTargetPick').value;
  const btn = document.getElementById('mgMoveBtn');
  btn.disabled = true;
  try{
    if(targetId==='__new__'){
      const name = document.getElementById('mgNewQbName').value.trim();
      if(!name){ st.textContent = 'Enter a name for the new qbank.'; btn.disabled=false; return; }
      const { data: newQb, error } = await sb.from('qbanks').insert({name}).select().maybeSingle();
      if(error) throw error;
      targetId = newQb.id;
    }
    if(targetId === document.getElementById('mgQbPick').value){ st.textContent = "Source and target are the same qbank."; btn.disabled=false; return; }
    // Same chunk size/approach as qbank deletion: keeps every UPDATE statement
    // small enough to avoid a statement timeout on sections with 100k+ rows.
    const CHUNK = 40;
    for(let i=0;i<ids.length;i+=CHUNK){
      const chunk = ids.slice(i,i+CHUNK);
      st.textContent = `Moving… sections ${i+1}-${Math.min(i+CHUNK,ids.length)} of ${ids.length}`;
      await sb.from('questions').update({qbank_id:targetId}).in('folder_id', chunk);
      await sb.from('sets').update({qbank_id:targetId}).in('folder_id', chunk);
      await sb.from('folders').update({qbank_id:targetId}).in('id', chunk);
    }
    st.textContent = `Done — ${ids.length} section(s) moved.`;
  }catch(err){
    st.textContent = 'Move failed: ' + (err?.message||err);
  }
  btn.disabled = false;
  renderMoveFolderList();
}
