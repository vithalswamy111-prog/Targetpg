    renderEsSets();
  };
}

function numToLetters(n){
  // 1->A, 26->Z, 27->AA … so referral lists longer than 26 don't break.
  let s = '';
  while(n > 0){ n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n/26); }
  return s;
}
function buildReferralTree(users, coupons){
  const promoterOfCoupon = {};
  (coupons||[]).forEach(c=> promoterOfCoupon[c.id] = c.promoter_id);
  const userIds = new Set(users.map(u=>u.id));
  const childrenByPromoter = {};
  const childIds = new Set();
  users.forEach(u=>{
    const promoterId = u.referred_by_coupon ? promoterOfCoupon[u.referred_by_coupon] : null;
    if(promoterId && userIds.has(promoterId) && promoterId !== u.id){
      (childrenByPromoter[promoterId] = childrenByPromoter[promoterId] || []).push(u);
      childIds.add(u.id);
    }
  });
  const topLevel = users.filter(u=> !childIds.has(u.id));
  return { topLevel, childrenByPromoter };
}
async function adminUsers(){
  const body=document.getElementById('atabBody');
  body.innerHTML = `<div class="card muted">Loading users…</div>`;
  // KGMU pinning + name/email search both now happen inside Postgres via the
  // admin_list_users RPC (see the SQL block) — only pendingPays/coupons stay
  // as separate lightweight queries here since they don't change per search.
  const [{ data: pendingPays }, { data: coupons }] = await Promise.all([
    sb.from('payments').select('user_id').eq('status','pending'),
    sb.from('coupons').select('id,promoter_id')
  ]);
  const pendingByUser = {}; (pendingPays||[]).forEach(p=> pendingByUser[p.user_id] = (pendingByUser[p.user_id]||0)+1);
  const promoterIds = new Set((coupons||[]).map(c=>c.promoter_id));
  body.innerHTML = `<div class="card">
  <div class="row" style="justify-content:space-between;align-items:center;">
    <h3 style="margin:0;">Users</h3>
    <button class="subtle" id="usersPdfBtn">⬇️ Download Users PDF</button>
  </div>
  <div class="muted" style="margin:8px 0;">Click a user to open their full profile, verify payments and manage access — all in one place. KGMU College users are always pinned to the top. Referrers are numbered 1, 2, 3…; the people they referred are nested underneath as 3A, 3B, 3C.</div>
  <div class="row" style="gap:8px;align-items:center;margin-bottom:10px;">
    <input id="userSearch" placeholder="Search by name or email…" style="flex:1;">
    <span id="userSearchSpinner" class="muted" style="font-size:12px;display:none;white-space:nowrap;">Searching…</span>
  </div>
  <div id="userList"><div class="muted" style="padding:10px 0;">Loading users…</div></div></div>`;
  document.getElementById('usersPdfBtn').onclick = downloadUsersPDF;
  const listEl = document.getElementById('userList');
  const spinner = document.getElementById('userSearchSpinner');
  function rowHtml(u, idx, nested){
    const isReferrer = promoterIds.has(u.id);
    const isKGMU = /kgmu/i.test(u.college||'');
    return `<div class="userrow" data-u="${u.id}" style="${nested?'margin-left:26px;padding-left:14px;border-left:2px solid var(--border);':''}${isKGMU?'background:color-mix(in srgb, var(--surface-2) 40%, transparent);':''}">
      <span class="muted" style="font-family:var(--mono);font-weight:700;min-width:28px;">${idx}</span>
      ${u.avatar_url?`<img src="${u.avatar_url}">`:`<div class="avplaceholder">${(u.name||u.email||'?').charAt(0).toUpperCase()}</div>`}
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;">${escapeHtml(u.name||'(no name)')}
          ${isKGMU?'<span class="badge active" style="margin-left:6px;">📌 KGMU</span>':''}
          ${isReferrer?'<span class="badge active" style="margin-left:6px;">Referrer</span>':''}
          ${pendingByUser[u.id]?`<span class="badge pending" style="margin-left:6px;">${pendingByUser[u.id]} payment${pendingByUser[u.id]>1?'s':''} pending</span>`:''}
        </div>
        <div class="muted" style="font-size:12.5px;">${escapeHtml(u.email)} ${u.college?'· '+escapeHtml(u.college):''}</div>
      </div>
      <span class="badge ${u.status}">${u.status}</span>
    </div>`;
  }
  // Single source of truth for pulling users: always goes through the
  // admin_list_users RPC, which does the KGMU-pinned ORDER BY and the
  // ILIKE name/email match server-side in one round trip — no more pulling
  // every profile down to the browser just to filter/sort it in JS.
  let fetchToken = 0;
  async function fetchUsers(term){
    const myFetch = ++fetchToken;
    spinner.style.display = 'inline';
    const { data, error } = await sb.rpc('admin_list_users', { p_search: term || null });
    if(myFetch !== fetchToken) return null; // a newer keystroke already superseded this in-flight request
    spinner.style.display = 'none';
    if(error){
      listEl.innerHTML = `<p style="color:var(--red);">Couldn't load users — ${error.message}. Make sure the admin_list_users function has been set up in Firestore.</p>`;
      return null;
    }
    return data || [];
  }
  async function renderTree(){
    const users = await fetchUsers('');
    if(users === null) return;
    const { topLevel, childrenByPromoter } = buildReferralTree(users, coupons);
    let html = '';
    topLevel.forEach((u,i)=>{
      const idx = i+1;
      html += rowHtml(u, idx, false);
      (childrenByPromoter[u.id]||[]).forEach((child, j)=>{
        html += rowHtml(child, `${idx}${numToLetters(j+1)}`, true);
      });
    });
    listEl.innerHTML = html || '<p class="muted">No users yet.</p>';
    bindRows();
  }
  async function renderFlat(term){
    const users = await fetchUsers(term);
    if(users === null) return;
    if(!users.length){ listEl.innerHTML = '<p class="muted">No matching users.</p>'; return; }
    listEl.innerHTML = users.map(u=>rowHtml(u, '•', false)).join('');
    bindRows();
  }
  function bindRows(){
    listEl.querySelectorAll('.userrow').forEach(row=>{
      row.onclick = ()=> openUserModal(row.dataset.u);
    });
  }
  renderTree();
  // Debounced so each keystroke doesn't fire its own Supabase round trip —
  // fetchToken above also guards against an older, slower request clobbering
  // a newer, faster one if responses arrive out of order.
  let searchDebounce;
  document.getElementById('userSearch').oninput = (e)=>{
    const term = e.target.value.trim();
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{
      term ? renderFlat(term) : renderTree();
    }, 300);
  };
}

// Admin-only backup export: every registered user's Name, Email, Signup
// Date, Subscription Status and Subscription Expiry as a clean PDF, so the
// admin always has an offline copy if the app or the Supabase project ever
// has an issue. Re-verifies a live admin session (not just S.profile, which
// could be stale) before touching the database, and every string is escaped
// through sanitizeInput() before it goes anywhere near the PDF, so a
// mischievous name/college field can't inject anything.
async function downloadUsersPDF(){
  const btn = document.getElementById('usersPdfBtn');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Checking access…';
  try{
    const auth = await verifyAdminSession();
    if(!auth.ok){ toast(auth.reason); return; }

    btn.textContent = 'Fetching users…';
    const users = await fetchAllRows(()=> sb.from('profiles')
      .select('name,email,created_at,status,subscription_expiry')
      .neq('role','admin')
      .order('created_at', {ascending:true}));

    if(!users.length){ toast('No users to export.'); return; }

    btn.textContent = 'Building PDF…';
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });

    const generatedAt = new Date();
    const clean = (v)=> sanitizeInput(v==null ? '' : String(v), 200) || '—';
    const fmtDate = (v)=> v ? new Date(v).toLocaleDateString() : '—';

    doc.setFontSize(16);
    doc.text('QBank Hub — Registered Users Backup', 40, 40);
    doc.setFontSize(10);
    doc.setTextColor(110);
    doc.text(`Generated ${generatedAt.toLocaleString()} · ${users.length} user${users.length===1?'':'s'}`, 40, 58);
    doc.setTextColor(20);

    const rows = users.map(u=>[
      clean(u.name),
      clean(u.email),
      fmtDate(u.created_at),
      clean(u.status),
      fmtDate(u.subscription_expiry)
    ]);

    doc.autoTable({
      head: [['Name', 'Email', 'Signup Date', 'Subscription Status', 'Subscription Expiry']],
      body: rows,
      startY: 72,
      styles: { fontSize: 9, cellPadding: 5, overflow: 'linebreak' },
      headStyles: { fillColor: [17, 23, 38], textColor: 255, fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [245, 245, 245] },
      margin: { left: 40, right: 40 },
      didDrawPage: (data)=>{
        const pageCount = doc.internal.getNumberOfPages();
        doc.setFontSize(8);
        doc.setTextColor(140);
        doc.text(`Page ${doc.internal.getCurrentPageInfo().pageNumber} of ${pageCount}`, data.settings.margin.left, doc.internal.pageSize.getHeight()-20);
      }
    });

    const stamp = generatedAt.toISOString().slice(0,10);
    doc.save(`qbank-users-backup-${stamp}.pdf`);
    toast('PDF downloaded');
  }catch(err){
    toast('Export failed — '+(err?.message||'unknown error'));
  }finally{
    btn.disabled = false; btn.textContent = original;
  }
}

    }
    toast('User verified — 1-day free trial active until ' + new Date(trialExpiry).toLocaleString());
    renderUserModalBody(uid, overlay);
    adminUsers();
  };
  document.getElementById('umToggle').onclick = async ()=>{
    const next = u.status==='active' ? 'revoked' : 'active';
    const { error: togErr } = await sb.from('profiles').update({status:next}).eq('id', uid);
    if(togErr){ toast('Failed — '+togErr.message); return; }
    if(next==='revoked'){ await sb.from('devices').delete().eq('user_id', uid); }
    toast(next==='active'?'Account activated':'Access revoked');
    renderUserModalBody(uid, overlay);
    adminUsers();
  };
  document.getElementById('umDelete').onclick = async ()=>{
    if(!confirm(`Permanently delete ${u.name||u.email}? This wipes their profile, devices, payments, sets, attempts and coupons from Supabase auth + database — this can't be undone.`)) return;
    const delBtn = document.getElementById('umDelete');
    delBtn.disabled = true; delBtn.textContent = 'Deleting…';
    // Hard-delete requires the service-role key, which must never sit in
    // frontend code — so this calls the `delete-user` Edge Function, which
    // verifies the caller is an admin, wipes every dependent row, and then
    // deletes the actual auth.users record (not just the profiles row).
    // Deleting only `profiles` — the old bug — left the auth account alive,
    // so the profile came back the next time that person logged in.
    const { data, error: fnErr } = await sb.functions.invoke('delete-user', { body: { user_id: uid } });
    if(fnErr || !data?.success){
      toast('Delete failed — '+(data?.error || fnErr?.message || 'unknown error'));
      delBtn.disabled = false; delBtn.textContent = '🗑️ Permanently delete';
      return;
    }
    toast('User permanently deleted');
    overlay.remove();
    adminUsers();
  };
  body.querySelectorAll('tr[data-p]').forEach(tr=>{
    const pid = tr.dataset.p, planId = tr.dataset.plan;
    const vBtn = tr.querySelector('.umVerify');
    if(vBtn) vBtn.onclick = async ()=>{
      vBtn.disabled = true;
      let expiry = null;
      if(planId){
        const { data: plan } = await sb.from('plans').select('duration_days').eq('id', planId).maybeSingle();
        if(plan) expiry = new Date(Date.now() + plan.duration_days*24*60*60*1000).toISOString();
      }
      const { error: pErr } = await sb.from('payments').update({status:'verified'}).eq('id', pid);
      const updateFields = {status:'active'};
      if(expiry) updateFields.subscription_expiry = expiry;
      if(u.promoter_milestone_available) updateFields.promoter_milestone_available = false;
      const { error: uErr } = await sb.from('profiles').update(updateFields).eq('id', uid);
      if(pErr || uErr){ toast('Failed — '+(pErr?.message||uErr?.message)); vBtn.disabled=false; return; }
      toast('Payment verified & user activated');
      renderUserModalBody(uid, overlay);
      adminUsers();
    };
    const rBtn = tr.querySelector('.umReject');
    if(rBtn) rBtn.onclick = async ()=>{
      await sb.from('payments').update({status:'rejected'}).eq('id', pid);
      renderUserModalBody(uid, overlay);
    };
  });
}

// The old standalone "Coupons" admin tab has been removed — coupon generation
// and management now lives inline inside each user's profile modal (see
// renderUserModalBody / the "Coupon Management" card below).
function genCouponCode(promoterName){
  const base = (promoterName||'REF').replace(/[^a-zA-Z]/g,'').slice(0,4).toUpperCase() || 'REF';
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${base}${rand}`;
}
// Copies text to the clipboard, with a manual-select fallback for browsers/
// contexts where the async Clipboard API is unavailable (e.g. non-HTTPS
// admin previews), and gives the button transient visual feedback either way.
async function copyToClipboard(text, btn){
  const original = btn.textContent;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.textContent = '✓ Copied';
    toast('Coupon code copied');
  } catch(err){
    btn.textContent = 'Copy failed';
    toast('Could not copy — select and copy manually');
  }
  setTimeout(()=>{ btn.textContent = original; }, 1600);
}

async function adminQueries(){
  const body = document.getElementById('atabBody');
  body.innerHTML = `<div class="card muted">Loading queries…</div>`;
  const { data: queries, error } = await sb.from('question_queries').select('*').eq('status','pending').order('created_at',{ascending:true});
  if(error){
    body.innerHTML = `<div class="card"><h3>❓ Question Queries</h3><p class="muted" style="color:var(--red);">Couldn't load — ${error.message}. Make sure the question_queries table has been set up in Firestore.</p></div>`;
    return;
  }
  if(!queries || !queries.length){
    body.innerHTML = `<div class="card"><h3>❓ Question Queries</h3><p class="muted">No pending queries — you're all caught up. 🎉</p></div>`;
    return;
  }
  const qIds = [...new Set(queries.map(q=>q.question_id))];
  const uIds = [...new Set(queries.map(q=>q.user_id))];
  const [{ data: questions }, { data: users }] = await Promise.all([
    sb.from('questions').select('id, q_text, options, correct_index, subject, is_controversial').in('id', qIds),
    sb.from('profiles').select('id, name, email').in('id', uIds),
  ]);
  const qById = {}; (questions||[]).forEach(q=> qById[q.id]=q);
  const uById = {}; (users||[]).forEach(u=> uById[u.id]=u);

  body.innerHTML = `<div class="card"><h3>❓ Question Queries</h3><p class="muted">Students' doubts raised during review — accept their suggested answer, mark the question controversial, or dismiss.</p></div>` +
    queries.map(qq=>{
      const q = qById[qq.question_id];
      const u = uById[qq.user_id];
      if(!q) return '';
      return `<div class="card querycard" style="margin-top:12px;" data-qid="${qq.id}">
        <div class="muted" style="font-size:12px;">👤 ${escapeHtml(u?(u.name||u.email):'Unknown user')} · 📅 ${new Date(qq.created_at).toLocaleDateString()} ${q.is_controversial?'· <span style="color:var(--red);">⚠️ already marked controversial</span>':''}</div>
        <div style="font-weight:600;margin:8px 0;">${renderRichText(q.q_text)}</div>

        <div class="muted" style="font-size:13px;margin-top:2px;">🎯 Student suggests: <b style="color:var(--cyan);">${escapeHtml(q.options[qq.suggested_correct_index]||'—')}</b></div>
        <div class="card muted querynote" style="margin-top:8px;">"${escapeHtml(qq.query_text||'')}"</div>
        <div class="row" style="margin-top:12px;flex-wrap:wrap;">
          <button class="primary iconbtn" data-accept="${qq.id}">✅ Accept &amp; update answer</button>
          <button class="danger iconbtn" data-controversial="${qq.id}">⚠️ Mark controversial</button>
          <button class="ghost iconbtn" data-dismiss="${qq.id}">✖ Dismiss</button>
        </div>
      </div>`;
    }).join('');

  body.querySelectorAll('[data-accept]').forEach(b=>{
    b.onclick = async ()=>{
      const qq = queries.find(x=>x.id===b.dataset.accept);
      if(!confirm('Update this question\'s correct answer to the student\'s suggestion?')) return;
      b.disabled = true;
      const { error: e1 } = await sb.from('questions').update({ correct_index: qq.suggested_correct_index }).eq('id', qq.question_id);
      const { error: e2 } = await sb.from('question_queries').update({ status:'resolved', resolved_at: new Date().toISOString() }).eq('id', qq.id);
      if(e1 || e2){ toast('Failed: '+(e1?.message||e2?.message)); b.disabled=false; return; }
      toast('Answer updated');
      adminQueries();
    };
  });
  body.querySelectorAll('[data-controversial]').forEach(b=>{
    b.onclick = async ()=>{
      const qq = queries.find(x=>x.id===b.dataset.controversial);
      b.disabled = true;
      const { error: e1 } = await sb.from('questions').update({ is_controversial:true }).eq('id', qq.question_id);
      const { error: e2 } = await sb.from('question_queries').update({ status:'resolved', resolved_at: new Date().toISOString(), admin_note:'Marked controversial' }).eq('id', qq.id);
      if(e1 || e2){ toast('Failed: '+(e1?.message||e2?.message)); b.disabled=false; return; }
      toast('Question marked controversial');
      adminQueries();
    };
  });
  body.querySelectorAll('[data-dismiss]').forEach(b=>{
    b.onclick = async ()=>{
      const qq = queries.find(x=>x.id===b.dataset.dismiss);

      const { error: e1 } = await sb.from('question_queries').update({ status:'dismissed', resolved_at: new Date().toISOString(), admin_note: note }).eq('id', qq.id);
      if(e1){ toast('Failed: '+e1.message); b.disabled=false; return; }
      toast('Dismissed');
      adminQueries();
    };
  });
}

async function findCustomSets(){
  const raw = document.getElementById('csSearch').value.trim();
  const status = document.getElementById('csStatus');
  const results = document.getElementById('csResults');
  results.innerHTML = '';
  if(!raw){ status.textContent = 'Type an email or a share code first.'; return; }
  status.textContent = 'Searching…';

  // Share codes are 6 characters and never contain '@'; treat anything
  // shaped like that as a code lookup, everything else as an email search.
  if(!raw.includes('@') && raw.length <= 8){
    const { data: set } = await sb.from('sets').select('*').eq('share_code', raw.toUpperCase()).eq('set_type','custom').maybeSingle();
    if(!set){ status.textContent = 'No custom set found with that code.'; return; }
    const { data: owner } = await sb.from('profiles').select('id,name,email').eq('id', set.user_id).maybeSingle();
    status.textContent = '';
    renderCustomSetResults([set], owner ? {[owner.id]: owner} : {});
    return;
  }

  const { data: users } = await sb.from('profiles').select('id,name,email').ilike('email', `%${raw}%`);
  if(!users || !users.length){ status.textContent = 'No student found with that email.'; return; }
  const { data: sets } = await sb.from('sets').select('*').in('user_id', users.map(u=>u.id)).eq('set_type','custom').order('created_at',{ascending:false});
  status.textContent = '';
  if(!sets || !sets.length){ results.innerHTML = '<p class="muted">This student hasn\'t built any custom sets yet.</p>'; return; }
  const byId = {}; users.forEach(u=> byId[u.id]=u);
  renderCustomSetResults(sets, byId);
}
function renderCustomSetResults(sets, ownerById){
  const results = document.getElementById('csResults');
  results.innerHTML = sets.map(s=>{
    const owner = ownerById[s.user_id];
    const n = (s.question_ids||[]).length;
    return `<div class="qrow" data-cs="${s.id}">
      <div><b>${escapeHtml(s.subject||'Custom set')}</b> · ${n} q ${owner?`· ${escapeHtml(owner.name||owner.email)}`:''} ${s.share_code?`· code <span style="font-family:var(--mono);">${s.share_code}</span>`:''}</div>
      <button class="subtle" data-rank="${s.id}">Rank list</button>
    </div>`;
  }).join('');
  results.querySelectorAll('[data-rank]').forEach(b=>{
    b.onclick = ()=>{
      const s = sets.find(x=>x.id===b.dataset.rank);
      const owner = ownerById[s.user_id];
      loadRankList('customset', { p_set_id: s.id, p_user_id: S.profile.id }, `${s.subject||'Custom set'}${owner?' — built by '+(owner.name||owner.email):''}`);
    };
  });
}
async function loadRankList(scope, params, title){
  const result = document.getElementById('rankResult');
  result.innerHTML = `<div class="card muted">Loading…</div>`;
  const rpcName = {
    set:'admin_set_rank_list', subject:'admin_subject_rank_list',
    folder:'admin_folder_rank_list', examtype:'admin_examtype_rank_list', overall:'admin_overall_rank_list',
    customset:'set_rank_list_public'
  }[scope];
  const { data, error } = await sb.rpc(rpcName, params);
  if(error){
    result.innerHTML = `<div class="card"><h3>${title}</h3><p class="muted" style="color:var(--red);">Couldn't load this rank list — ${error.message}. Make sure the ranking SQL functions have been set up in Firestore.</p></div>`;
    return;
  }
  renderRankTable(data||[], title);
}
function renderRankTable(rows, title){
  const result = document.getElementById('rankResult');
  if(!rows.length){
    result.innerHTML = `<div class="card"><h3>${title}</h3><p class="muted">No submitted attempts here yet.</p></div>`;
    return;
  }
  const rowsHtml = rows.map(r=>{
    const pct = r.total_questions ? Math.round((r.correct_count/r.total_questions)*1000)/10 : 0;
    return `<tr><td>${r.rnk ?? ''}</td><td>${escapeHtml(r.name||'—')}</td><td>${escapeHtml(r.batch||'—')}</td><td>${escapeHtml(r.college||'—')}</td><td>${escapeHtml(r.email||'')}</td><td>${r.correct_count}/${r.total_questions}</td><td>${pct}%</td><td>${r.score>0?'+':''}${r.score}</td></tr>`;
  }).join('');
  result.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between;">
      <h3>${title}</h3>
      <button class="subtle" id="rkDownloadPdf">⬇️ Download PDF</button>
    </div>
    <div style="overflow-x:auto;"><table class="ranktbl"><tr><th>Rank</th><th>Name</th><th>Batch</th><th>College</th><th>Email</th><th>Correct</th><th>%</th><th>Score</th></tr>${rowsHtml}</table></div>
  </div>
  <div id="printArea" style="display:none;">
    <h2 style="font-family:Arial;">${title}</h2>
    <table style="width:100%;border-collapse:collapse;font-family:Arial;font-size:12px;">
      <tr style="background:#eee;"><th style="border:1px solid #999;padding:6px;">Rank</th><th style="border:1px solid #999;padding:6px;">Name</th><th style="border:1px solid #999;padding:6px;">Batch</th><th style="border:1px solid #999;padding:6px;">College</th><th style="border:1px solid #999;padding:6px;">Email</th><th style="border:1px solid #999;padding:6px;">Correct</th><th style="border:1px solid #999;padding:6px;">%</th><th style="border:1px solid #999;padding:6px;">Score</th></tr>
      ${rows.map(r=>{
        const pct = r.total_questions ? Math.round((r.correct_count/r.total_questions)*1000)/10 : 0;
        return `<tr><td style="border:1px solid #999;padding:6px;">${r.rnk ?? ''}</td><td style="border:1px solid #999;padding:6px;">${escapeHtml(r.name||'—')}</td><td style="border:1px solid #999;padding:6px;">${escapeHtml(r.batch||'—')}</td><td style="border:1px solid #999;padding:6px;">${escapeHtml(r.college||'—')}</td><td style="border:1px solid #999;padding:6px;">${escapeHtml(r.email||'')}</td><td style="border:1px solid #999;padding:6px;">${r.correct_count}/${r.total_questions}</td><td style="border:1px solid #999;padding:6px;">${pct}%</td><td style="border:1px solid #999;padding:6px;">${r.score>0?'+':''}${r.score}</td></tr>`;
      }).join('')}
    </table>
  </div>`;
  document.getElementById('rkDownloadPdf').onclick = ()=>{
    // Prints just #printArea (see the @media print rule) — the browser's
    // print dialog has a "Save as PDF" destination on every platform, so
    // this hands the admin a real downloadable PDF without any extra library.
    window.print();
  };
}

boot();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
