<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QBank Console</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#070B14; --surface:#111726; --surface-2:#182034; --surface-3:#1F2A42; --border:#28324E;
  --border-soft:rgba(255,255,255,.055);
  --paper:#EFEEE7; --paper-2:#E4E2D8;
  --text:#EEF1FA; --text-dim:#8D97B4; --text-inv:#141B2E;
  --amber:#EFA53E; --amber-2:#FFCE7A; --amber-dim:#3A2C13;
  --cyan:#57CFE0; --cyan-dim:#122E33;
  --gray:#8A93A6; --red:#F0525A; --green:#30B87A; --purple:#9B7CF6;
  --radius:16px; --radius-lg:22px;
  --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  --shadow:0 10px 34px -10px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
  --shadow-sm:0 3px 12px rgba(0,0,0,.3);
  --glow-amber:0 0 0 1px rgba(239,165,62,.28), 0 0 22px -4px rgba(239,165,62,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
  --bg-image:
    radial-gradient(circle at 14% -4%, rgba(239,165,62,.12) 0%, transparent 40%),
    radial-gradient(circle at 100% 6%, rgba(87,207,224,.10) 0%, transparent 38%),
    radial-gradient(circle at 50% 120%, rgba(155,124,246,.07) 0%, transparent 45%),
    linear-gradient(to top right, #000000 0%, #05070E 20%, #0A0F1C 38%, #101A2E 56%, #182645 76%, #223A5F 100%);
}
html.light{
  --bg:#F5F2E9; --surface:#FFFFFF; --surface-2:#F1EEE2; --surface-3:#E8E3D2; --border:#E1DBC8;
  --border-soft:rgba(20,15,5,.06);
  --text:#221D13; --text-dim:#6B6455; --text-inv:#FFFFFF;
  --amber:#B9791F; --amber-2:#8F5D12; --amber-dim:#F3E3C4;
  --cyan:#1591A3; --cyan-dim:#DEF3F5;
  --gray:#B7AF9D; --shadow:0 10px 28px -8px rgba(80,60,20,.14), 0 2px 8px rgba(80,60,20,.08);
  --shadow-sm:0 3px 10px rgba(80,60,20,.08);
  --glow-amber:0 0 0 1px rgba(185,121,31,.25), 0 0 18px -5px rgba(185,121,31,.35);
  --bg-image:radial-gradient(circle at 10% -4%, rgba(251,243,220,.7) 0%, transparent 42%),radial-gradient(circle at 100% 4%, rgba(232,244,242,.6) 0%, transparent 40%),linear-gradient(to top right, #EAD497 0%, #F0E2BC 22%, #F5ECD6 42%, #FAF6EA 62%, #FDFBF5 82%, #FFFFFF 100%);
}
html.sky{
  --bg:#EAF5FD; --surface:#FFFFFF; --surface-2:#E3F1FB; --surface-3:#D2E8F8; --border:#BEDFF4;
  --border-soft:rgba(20,70,110,.07);
  --text:#123049; --text-dim:#5C7E96; --text-inv:#FFFFFF;
  --amber:#2E9BE6; --amber-2:#6FC4F5; --amber-dim:#D7EEFC;
  --cyan:#0FA6C9; --cyan-dim:#DBF4FA;
  --gray:#A9C9DE; --red:#E15660; --green:#1FAE7A; --purple:#8B7CF2;
  --shadow:0 10px 30px -9px rgba(20,90,140,.16), 0 2px 9px rgba(20,90,140,.09);
  --shadow-sm:0 3px 11px rgba(20,90,140,.09);
  --glow-amber:0 0 0 1px rgba(46,155,230,.25), 0 0 20px -5px rgba(46,155,230,.4);
  --bg-image:radial-gradient(circle at 12% -4%, rgba(216,236,251,.7) 0%, transparent 42%),radial-gradient(circle at 100% 6%, rgba(207,239,245,.6) 0%, transparent 40%),linear-gradient(to top right, #AED7F2 0%, #C4E3F7 22%, #DAEFFB 42%, #EBF6FD 62%, #F6FBFE 82%, #FFFFFF 100%);
}
*{box-sizing:border-box;}
@media(prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;} }
html,body{margin:0;padding:0;background:var(--bg-image);background-attachment:fixed;color:var(--text);font-family:var(--body);height:100%;font-size:16.5px;-webkit-font-smoothing:antialiased;}
body{position:relative;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:repeating-linear-gradient(180deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px);}
html.light body::before{opacity:.35; background-image:repeating-linear-gradient(180deg, rgba(20,15,5,.01) 0px, rgba(20,15,5,.01) 1px, transparent 1px, transparent 3px);}
html.sky body::before{opacity:.3; background-image:repeating-linear-gradient(180deg, rgba(10,50,90,.012) 0px, rgba(10,50,90,.012) 1px, transparent 1px, transparent 3px);}
#app{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
::selection{background:var(--amber);color:#241a06;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--amber-dim);}
a{color:var(--amber);}
h1,h2,h3{font-family:var(--display);margin:0 0 8px;letter-spacing:.01em;}
h2{font-size:22px;} h3{font-size:18px;}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px;}
button{font-family:var(--body);cursor:pointer;border:none;border-radius:13px;padding:13px 20px;font-weight:700;font-size:15.5px;transition:transform .16s var(--ease), opacity .15s, box-shadow .2s, background .2s, border-color .2s;min-height:46px;position:relative;backdrop-filter:blur(6px);}
button:active{transform:scale(.96);}
button.primary{background:linear-gradient(135deg, color-mix(in srgb, var(--amber) 94%, transparent), color-mix(in srgb, var(--amber-2) 90%, transparent));color:#241a06;box-shadow:0 3px 14px rgba(239,165,62,.32), inset 0 1px 0 rgba(255,255,255,.28);}
button.primary:hover{box-shadow:0 6px 20px rgba(239,165,62,.48), inset 0 1px 0 rgba(255,255,255,.32);transform:translateY(-1px);}
button.primary:active{transform:translateY(0) scale(.96);}
button.ghost{background:linear-gradient(135deg, color-mix(in srgb, var(--amber-dim) 30%, transparent), color-mix(in srgb, var(--surface-2) 35%, transparent));color:var(--text);border:1.5px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 10px rgba(0,0,0,.18);}
button.ghost:hover{border-color:var(--amber);color:var(--amber-2);background:linear-gradient(135deg, color-mix(in srgb, var(--amber-dim) 60%, transparent), color-mix(in srgb, var(--surface-3) 40%, transparent));}
button.danger{background:linear-gradient(135deg, color-mix(in srgb, var(--red) 90%, transparent), color-mix(in srgb, #c93840 88%, transparent));color:#fff;box-shadow:0 3px 12px rgba(229,72,77,.28), inset 0 1px 0 rgba(255,255,255,.2);}
button.danger:hover{box-shadow:0 6px 18px rgba(229,72,77,.4);transform:translateY(-1px);}
button.subtle{background:linear-gradient(135deg, color-mix(in srgb, var(--surface-2) 78%, transparent), color-mix(in srgb, var(--surface-3) 60%, transparent));color:var(--text);border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 3px 12px rgba(0,0,0,.22);}
button.subtle:hover{background:linear-gradient(135deg, color-mix(in srgb, var(--surface-3) 88%, transparent), color-mix(in srgb, var(--surface-2) 68%, transparent));border-color:color-mix(in srgb, var(--amber) 35%, var(--border));}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
button.iconbtn{padding:8px 12px;font-size:16px;min-height:auto;border-radius:10px;}
input,select,textarea{font-family:var(--body);background:linear-gradient(135deg, color-mix(in srgb, var(--surface-2) 92%, transparent), color-mix(in srgb, var(--surface-3) 80%, transparent));border:1.5px solid var(--border);color:var(--text);padding:13px 14px;border-radius:12px;font-size:16px;font-weight:600;width:100%;min-height:46px;transition:border-color .15s, box-shadow .15s;}
select{cursor:pointer;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(239,165,62,.15);}
label{font-size:12.5px;color:var(--text-dim);display:block;margin:11px 0 5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(10px);z-index:50;box-shadow:var(--shadow-sm);}
.brand{font-family:var(--display);font-weight:700;font-size:20.5px;letter-spacing:.01em;display:flex;align-items:center;gap:9px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber), 0 0 2px var(--amber);position:relative;animation:dotPulse 2.4s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{box-shadow:0 0 8px var(--amber), 0 0 2px var(--amber);}50%{box-shadow:0 0 16px var(--amber), 0 0 4px var(--amber);}}
.container{max-width:960px;margin:0 auto;padding:24px 18px 90px;width:100%;flex:1;}
@keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card{background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 100%, white 2%), var(--surface));border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);animation:riseIn .38s var(--ease) both;transition:border-color .2s, box-shadow .2s;}
.badge{display:inline-block;padding:4px 11px;border-radius:100px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.badge.active{background:#123822;color:var(--green);box-shadow:inset 0 0 0 1px rgba(48,184,122,.35);}
.badge.pending{background:#392b10;color:var(--amber);box-shadow:inset 0 0 0 1px rgba(239,165,62,.35);}
.badge.revoked{background:#3d1519;color:var(--red);box-shadow:inset 0 0 0 1px rgba(240,82,90,.35);}
.badge.unset{background:#332711;color:var(--text-dim);box-shadow:inset 0 0 0 1px var(--border);}
.locked-blur{filter:blur(6px);-webkit-filter:blur(6px);user-select:none;cursor:default;}
.badge.verified{background:#123822;color:var(--green);box-shadow:inset 0 0 0 1px rgba(48,184,122,.35);}
.badge.rejected{background:#3d1519;color:var(--red);box-shadow:inset 0 0 0 1px rgba(240,82,90,.35);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.muted{color:var(--text-dim);font-size:14px;}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border-soft);margin-bottom:18px;overflow-x:auto;}
.tab{padding:13px 16px;font-size:15px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;min-height:46px;display:flex;align-items:center;transition:color .18s, border-color .18s;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--amber);border-color:var(--amber);}
.crumbs{font-size:13px;color:var(--text-dim);margin-bottom:12px;}
.crumbs span{cursor:pointer;color:var(--amber);}
.crumbs span:hover{text-decoration:underline;}
.qrow{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:linear-gradient(135deg, color-mix(in srgb, var(--amber-dim) 46%, transparent), color-mix(in srgb, var(--surface-2) 70%, transparent));border:1px solid color-mix(in srgb, var(--amber) 26%, var(--border));border-radius:14px;margin-bottom:10px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 16px -8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);transition:background .18s, transform .16s var(--ease), border-color .18s, box-shadow .18s;animation:riseIn .34s var(--ease) both;}
.qrow:hover{background:linear-gradient(135deg, color-mix(in srgb, var(--amber-dim) 72%, transparent), color-mix(in srgb, var(--surface-3) 65%, transparent));border-color:var(--amber);transform:translateX(3px);box-shadow:0 6px 22px -6px rgba(239,165,62,.28), var(--shadow-sm);}
.qrow b{color:var(--amber-2);font-weight:800;font-size:15.5px;letter-spacing:.005em;}
.lockicon{opacity:.6;font-size:15px;}
.exam-shell{display:grid;grid-template-columns:1fr 260px;gap:0;flex:1;}
@media(max-width:760px){.exam-shell{grid-template-columns:1fr;}}
.exam-main{padding:20px;overflow-y:auto;}
.exam-side{background:var(--surface);border-left:1px solid var(--border-soft);padding:16px;}
.timer-ring{display:inline-flex;padding:3px;border-radius:14px;background:conic-gradient(var(--amber) calc(var(--pct,100)*1%), var(--border) 0);transition:background .5s linear;}
.timer-ring.low{background:conic-gradient(var(--red) calc(var(--pct,100)*1%), var(--border) 0);animation:timerLowPulse 1s ease-in-out infinite;}
@keyframes timerLowPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}
.timer{font-family:var(--mono);font-size:27px;font-weight:600;color:var(--amber);letter-spacing:.03em;background:var(--amber-dim);padding:8px 14px;border-radius:11px;display:inline-block;}
.timer-ring.low .timer{color:var(--red);}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:18px;line-height:1.5;transition:border-color .18s, background .18s, transform .16s var(--ease);animation:riseIn .3s var(--ease) both;}
.opt:nth-of-type(1){animation-delay:0ms;} .opt:nth-of-type(2){animation-delay:40ms;} .opt:nth-of-type(3){animation-delay:80ms;} .opt:nth-of-type(4){animation-delay:120ms;} .opt:nth-of-type(5){animation-delay:160ms;}
.opt:hover{border-color:var(--amber);transform:translateX(2px);}
.opt.sel{border-color:var(--amber);background:var(--amber-dim);box-shadow:var(--glow-amber);}
.opt.correct{border-color:var(--green);background:#0f2a1c;box-shadow:0 0 0 1px rgba(48,184,122,.3), 0 0 18px -6px rgba(48,184,122,.5);}
.opt.wrong{border-color:var(--red);background:#2a1113;box-shadow:0 0 0 1px rgba(240,82,90,.3), 0 0 18px -6px rgba(240,82,90,.5);}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px;}
.pnum{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent;color:#0B1220;min-height:28px;max-width:34px;transition:transform .15s var(--ease), filter .15s;}
.pnum:hover{transform:scale(1.1);filter:brightness(1.1);}
.pnum.not_visited{background:var(--gray);}
.pnum.not_answered{background:var(--red);color:#fff;}
.pnum.answered{background:var(--green);color:#fff;}
.pnum.marked{background:var(--purple);color:#fff;}
.pnum.answered_marked{background:var(--purple);color:#fff;box-shadow:inset 0 0 0 3px var(--green);}
.pnum.current{border-color:var(--amber);box-shadow:0 0 0 3px rgba(239,165,62,.25);}
.legend{display:flex;flex-direction:column;gap:5px;font-size:11px;margin-top:14px;color:var(--text-dim);}
.legend span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}
.reviewcard{background:var(--surface);color:var(--text);border-radius:var(--radius);padding:18px;margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow);animation:riseIn .34s var(--ease) both;}
.reviewcard .opt{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.reviewcard .opt.correct{background:#0f2a1c;border-color:var(--green);}
.reviewcard .opt.wrong{background:#2a1113;border-color:var(--red);}
.catbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.catbtns button{font-size:12px;padding:7px 10px;}
/* ---- Custom styled dropdown (replaces native <select> for subject/group pickers) ---- */
.csel{position:relative;max-width:320px;}
.csel-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg, color-mix(in srgb, var(--surface-2) 90%, transparent), color-mix(in srgb, var(--surface-3) 80%, transparent));border:1.5px solid var(--border);border-radius:13px;padding:13px 16px;font-weight:700;font-size:15px;color:var(--text);cursor:pointer;min-height:48px;transition:border-color .18s, box-shadow .18s, transform .12s var(--ease);}
.csel-trigger:hover{border-color:var(--amber);box-shadow:0 0 0 3px rgba(239,165,62,.12);}
.csel-trigger:active{transform:scale(.98);}
.csel-trigger .csel-tlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.csel-trigger .csel-chev{color:var(--amber);font-size:12px;flex:0 0 auto;transition:transform .2s var(--ease);}
.csel.open .csel-trigger .csel-chev{transform:rotate(180deg);}
.csel.open .csel-trigger{border-color:var(--amber);box-shadow:var(--glow-amber);}
.csel-sheet-overlay{position:fixed;inset:0;background:rgba(7,11,20,0);z-index:300;display:flex;align-items:flex-end;justify-content:center;transition:background .2s ease;}
.csel-sheet-overlay.in{background:rgba(7,11,20,.72);backdrop-filter:blur(4px);}
.csel-sheet{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;padding:10px 12px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -12px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .22s var(--ease);max-height:78vh;display:flex;flex-direction:column;}
.csel-sheet-overlay.in .csel-sheet{transform:translateY(0);}
.csel-sheet-handle{width:40px;height:4px;border-radius:3px;background:var(--border);margin:2px auto 12px;flex:none;}
.csel-sheet-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.csel-opt{display:flex;align-items:center;gap:13px;padding:12px 12px;border-radius:11px;cursor:pointer;transition:background .15s;}
.csel-opt:hover{background:var(--surface-2);}
.csel-opt.sel{background:linear-gradient(135deg, var(--amber-dim), color-mix(in srgb, var(--amber-dim) 55%, transparent));}
.csel-radio{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:2px solid color-mix(in srgb, var(--amber) 45%, var(--border));background:color-mix(in srgb, var(--amber) 10%, transparent);position:relative;transition:border-color .15s, background .15s, box-shadow .15s;}
.csel-opt.sel .csel-radio{border-color:var(--amber);background:radial-gradient(circle at 35% 30%, var(--amber-2), var(--amber) 72%);box-shadow:0 0 12px -1px rgba(239,165,62,.6);}
.csel-label{font-weight:700;font-size:14.5px;color:var(--text);flex:1;white-space:normal;line-height:1.36;word-break:break-word;}
.csel-opt.sel .csel-label{color:var(--amber-2);}
.overlay{position:fixed;inset:0;background:rgba(7,11,20,.82);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .2s ease both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;max-width:440px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px -12px rgba(0,0,0,.6);animation:riseIn .3s var(--ease) both;}
.rankmodal{max-width:480px;}
.rankmodal-head{display:flex;align-items:center;gap:12px;margin:-22px -22px 16px;padding:18px 20px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:linear-gradient(135deg, color-mix(in srgb, var(--amber-dim) 65%, transparent), color-mix(in srgb, var(--surface-2) 60%, transparent));border-bottom:1px solid var(--border-soft);position:relative;}
.rankmodal-icon{width:42px;height:42px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(135deg, var(--amber), var(--amber-2));box-shadow:var(--glow-amber);}
.rankmodal-head h3{font-family:var(--display);}
.modal-x{position:absolute;top:14px;right:14px;width:32px;height:32px;min-height:auto;padding:0;border-radius:50%;background:color-mix(in srgb, var(--surface) 60%, transparent);border:1px solid var(--border);color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:none;}
.modal-x:hover{color:var(--red);border-color:var(--red);}
.modal.usermodal{max-width:600px;}
.idcallout{background:linear-gradient(135deg, color-mix(in srgb, var(--amber-dim) 55%, transparent), color-mix(in srgb, var(--surface-2) 45%, transparent));border:1.5px solid var(--amber);border-radius:14px;padding:14px 16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.idcallout b{font-size:16px;}

<div id="app"><div class="spinner"></div></div>
<script type="module">
import { sb, bumpQuestionStats } from './fb-adapter.js';

const ADMIN_EMAIL = 'abhivanshsomvanshi@gmail.com';
const UPI_ID = '9145891969@ptyes';
const UPI_PAYEE_NAME = 'NeetPG QBank';
// Supabase/PostgREST silently caps any .select() with no .range() at ~1000
// rows — a qbank like Marrow with 3,599 sections (or a folder with 2,000+
// questions) would come back truncated with NO error, just fewer rows than
// actually exist. This pages through in batches of 1000 until exhausted,
// so anywhere that needs a genuinely complete list uses this instead of a
// bare .select().
async function fetchAllRows(buildQuery){
  let all = [], from = 0; const PAGE = 1000;
  while(true){
    const { data, error } = await buildQuery().range(from, from+PAGE-1);
    if(error) throw error;
    all = all.concat(data||[]);
    if(!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}
// Re-checks the ACTUAL live Supabase auth session (not just in-memory state
// like S.profile, which could be stale or, in a compromised client, spoofed)
// and re-reads the caller's role fresh from the profiles table. Every
// sensitive admin-only action (bulk export, revoking access, etc.) should
// call this immediately before doing its work. RLS on the server is the
// real security boundary — this is a client-side guard so a tampered UI
// state fails closed with a clear message instead of silently attempting
// a write/read that RLS will reject anyway.
async function verifyAdminSession(){
  const { data:{ session }, error: sessErr } = await sb.auth.getSession();
  if(sessErr || !session || !session.user) return { ok:false, reason:'You are not signed in. Please log in again.' };
  const { data: me, error: profErr } = await sb.from('profiles').select('id,role,status').eq('id', session.user.id).maybeSingle();
  if(profErr || !me) return { ok:false, reason:'Could not verify your account. Please log in again.' };
  if(me.role !== 'admin' || me.status !== 'active') return { ok:false, reason:'This action requires an active admin account.' };
  return { ok:true, session, profile: me };
}
const app = document.getElementById('app');

const CATS = [
  {key:'guess_work', label:'Guess work'},
  {key:'fact_unknown', label:'Fact unknown'},
  {key:'concept_unknown', label:'Concept unknown'},
  {key:'silly_mistake', label:'Silly mistake'},
];
// Groups a folder's name into a coarse bucket for filtering/browsing:
// "Anatomy - Abdomen & Pelvis" -> "Anatomy" (splits on " - ");
// "GT1", "PYQ 2023", "INICET Set 3" -> "GT" / "PYQ" / "INICET" (leading
// non-numeric word). Used by the Sections nav filter, the admin checklist,
// and the custom-test builder's Subject-wise/PYQ/GT source picker.
// One round trip for question counts across many folders at once (fetching
// only the folder_id column keeps the payload small), instead of firing a
// separate count query per folder — that N-query fan-out was the main
// source of lag when opening a platform/category on a slower connection.
async function countsByFolder(folderIds){
  const map = {};
  if(!folderIds || !folderIds.length) return map;
  const { data } = await sb.from('questions').select('folder_id').in('folder_id', folderIds);
  (data||[]).forEach(r=>{ map[r.folder_id] = (map[r.folder_id]||0) + 1; });
  return map;
}
function folderGroupOf(name){
  if(name.includes(' - ')) return name.split(' - ')[0].trim();
  const m = name.match(/^[^\d]+/);
  return (m ? m[0] : name).trim() || name;
}
// 3-level naming support: "Folder - Subfolder - Topic" (e.g. "Tests -
// Subject Test - Anatomy") lets an admin define their own custom top-level
// folder (shown as the big category card) with their own named subfolders
// inside it (shown in the dropdown one level down), instead of relying on
// the auto-detected 5-bucket category further below. Folder names with only
// 1-2 " - " segments keep the old auto-detected behaviour untouched, so
// nothing already uploaded changes.
function nameParts(name){ return String(name||'').split(' - ').map(s=>s.trim()).filter(Boolean); }
function subGroupOf(name){ const p = nameParts(name); return p.length>=3 ? p[1] : folderGroupOf(name); }
function leafNameOf(name){ const p = nameParts(name); if(p.length>=3) return p.slice(2).join(' - '); if(p.length===2) return p[1]; return name; }
// Plain alphabetical sort puts "GT 10" before "GT 2" (string comparison
// compares character-by-character, so '1' < '2' regardless of what follows).
// This compares embedded number runs as actual numbers instead, so a list
// like GT1, GT2, GT14, GT30 comes out in true numeric/serial order rather
// than GT1, GT14, GT2, GT30.
function naturalCompare(a, b){
  const ax = String(a||'').match(/\d+|\D+/g) || [];
  const bx = String(b||'').match(/\d+|\D+/g) || [];
  const len = Math.max(ax.length, bx.length);
  for(let i=0;i<len;i++){
    const av = ax[i], bv = bx[i];
    if(av===undefined) return -1;
    if(bv===undefined) return 1;
    const an = /^\d+$/.test(av), bn = /^\d+$/.test(bv);
    if(an && bn){
      const diff = parseInt(av,10) - parseInt(bv,10);
      if(diff) return diff;
    } else {
      const cmp = av.localeCompare(bv);
      if(cmp) return cmp;
    }
  }
  return 0;
}
const EXAM_CONFIG = {
  subjectwise:  {label:'Subject-wise', perSet:50, minutesPerFull:45, sequential:false},
  inicet:       {label:'INICET pattern',        perSet:50, minutesPerFull:45, sequential:true},
  neetpg:       {label:'NEET PG pattern',       perSet:40, minutesPerFull:42, sequential:true},
  updated_neetpg:{label:'Updated NEET PG pattern', perSet:36, minutesPerFull:42, sequential:true},
  auto_subsection:{label:'Auto (non-subject file) — 50 q / 45 min subsections', perSet:50, minutesPerFull:45, sequential:true},
};

// The 19 NEET PG subjects, each with common short/long-form aliases used by
// providers like BTR/Prepladder. A file/folder name is matched against these
// (whole-word, case-insensitive) to auto-detect that it's a subject file.
const SUBJECT_ALIASES = {
  'Anatomy':                    ['anatomy','anat'],
  'Physiology':                 ['physiology','physio','phys'],
  'Biochemistry':                ['biochemistry','biochem','bioc'],
  'Pathology':                   ['pathology','patho','path'],
  'Pharmacology':                ['pharmacology','pharma','pharm'],
  'Microbiology':                ['microbiology','micro'],
  'Forensic Medicine':           ['forensicmedicine','forensic','fmt'],
  'Community Medicine (PSM)':    ['communitymedicine','psm','sm','pmr'],
  'ENT':                         ['ent','otorhinolaryngology'],
  'Ophthalmology':               ['ophthalmology','ophthal','opth','eye'],
  'Medicine':                    ['medicine','generalmedicine','gm','im'],
  'Surgery':                     ['surgery','generalsurgery','gs'],
  'Pediatrics':                  ['pediatrics','paediatrics','peds','pedia'],
  'Obstetrics & Gynaecology':    ['obg','obstetrics','gynaecology','gynecology','gynae','og'],
  'Orthopedics':                 ['orthopedics','orthopaedics','ortho'],
  'Radiology':                   ['radiology','radiodiagnosis','radio'],
  'Anesthesia':                  ['anesthesia','anaesthesia','anaesthesiology','anesthesiology'],
  'Psychiatry':                  ['psychiatry','psych'],
  'Dermatology':                 ['dermatology','derma','dvl','skin'],
};
function detectSubject(name){
  const tokens = String(name||'').toLowerCase().replace(/\.(json|ndjson|txt)$/,'').split(/[^a-z0-9]+/).filter(Boolean);
  for(const tok of tokens){
    for(const subj in SUBJECT_ALIASES){
      if(SUBJECT_ALIASES[subj].includes(tok)) return subj;
    }
  }
  return null;
}
// Decides the exam pattern for an uploaded file purely from its name:
// - matches one of the 19 subjects (short or full form) -> subject-wise
//   (50 q / 45 min sets, last partial set gets 0.9 min/question)
// - anything else (gt1, gt2, neetpg, inicet, ...) -> auto_subsection
//   (50 q / 45 min sequential subsections inside one section, can't reopen
//   a submitted/expired subsection)
function autoDetectExamType(name){
  const subject = detectSubject(name);
  if(subject) return { type:'subjectwise', subject };
  return { type:'auto_subsection', subject:null };
}
// Detects which "platform" (qbank) a file belongs to from its name, e.g.
// "Prepladder_GT1.json" or "BTR Anatomy.json". Add more aliases here as
// you bring in more source platforms.
const PLATFORM_ALIASES = {
  'BTR': ['btr'],
  'Prepladder': ['prepladder'],
  'Marrow': ['marrow'],
  'Doc Tutorial': ['doctutorial','doctutorials','doctut'],
  'DAMS': ['dams'],
};
function detectPlatformName(name){
  const lower = String(name||'').toLowerCase().replace(/\.(json|ndjson|txt)$/,'');
  const tokens = lower.split(/[^a-z0-9]+/).filter(Boolean);
  const squashed = tokens.join(''); // handles multi-word platform names like "Doc Tutorial" -> "doctutorial"
  for(const platform in PLATFORM_ALIASES){
    if(PLATFORM_ALIASES[platform].some(a=>tokens.includes(a) || squashed.includes(a))) return platform;
  }
  return null;
}

// ---------- category grouping (Subject-wise / Tests / GT / NEET PG / INICET) ----------
// Buckets a folder into one of the 5 top-level categories the user browses
// by, computed purely from data already on hand (folder name + exam_type) —
// no extra Supabase query needed. Order here also drives display order.
const CATEGORY_ORDER = ['Subjectwise Qbank','Tests','Grand Tests (GT)','NEET PG','INICET','FMGE','Other'];
function categoryOf(f){
  const p = nameParts(f.name);
  if(p.length>=2) return p[0]; // explicit admin/pipeline-chosen top folder always wins
  if(f.exam_type==='subjectwise') return 'Subjectwise Qbank';
  const g = folderGroupOf(f.name).toLowerCase();
  if(f.exam_type==='inicet' || g.startsWith('inicet')) return 'INICET';
  if(f.exam_type==='neetpg' || f.exam_type==='updated_neetpg' || g.startsWith('neetpg') || g.startsWith('neet pg') || g.startsWith('neet')) return 'NEET PG';
  if(f.exam_type==='fmge' || g.startsWith('fmge')) return 'FMGE';
  if(g.startsWith('gt')) return 'Grand Tests (GT)';
  if(g.startsWith('pyq') || g.includes('test')) return 'Tests';
  return 'Other';
}

let S = { session:null, profile:null, deviceId:null, view:'loading', nav:{}, instructionsAcked:{} };

// ---------- theme (dark / light) ----------
function applyTheme(){
  const t = localStorage.getItem('qb_theme') || 'dark';
  document.documentElement.classList.toggle('light', t==='light');
  document.documentElement.classList.toggle('sky', t==='sky');
}
function themeIcon(t){ return t==='dark' ? '☀️' : t==='light' ? '🌤️' : '🌙'; }
function currentTheme(){ return localStorage.getItem('qb_theme') || 'dark'; }
function toggleTheme(){
  const order = ['dark','light','sky'];
  const cur = currentTheme();
  const next = order[(order.indexOf(cur)+1) % order.length];
  setTheme(next);
}
function setTheme(t){ localStorage.setItem('qb_theme', t); applyTheme(); render(); }
// Small trio of colour-preview dots (dark/light/sky) that replaces the old
// single cycling icon button — each swatch previews its theme's own tones
// and jumps straight there on tap, instead of one anonymous icon you had to
// tap repeatedly to cycle through.
function themeSwatchesHtml(){
  const cur = currentTheme();
  return `<div class="themeSwatches" id="themeSwatches">
    <span class="swatch dark ${cur==='dark'?'active':''}" data-t="dark" title="Dark"></span>
    <span class="swatch light ${cur==='light'?'active':''}" data-t="light" title="Light"></span>
    <span class="swatch sky ${cur==='sky'?'active':''}" data-t="sky" title="Sky"></span>
  </div>`;
}
function wireThemeSwatches(){
  const el = document.getElementById('themeSwatches');
  if(!el) return;
  el.querySelectorAll('.swatch').forEach(s=> s.onclick = ()=> setTheme(s.dataset.t));
}

// ---------- daily streak (client-side, per logged-in user) ----------
// Purely a motivational touch: counts consecutive calendar days the app has
// been opened, stored in localStorage per profile id (so it doesn't need a
// backend column). currentStreak() just reads it for display; bumpStreak()
// is the only thing that writes, called once per profile load.
function streakKey(){ return `qb_streak_${S.profile?.id||'anon'}`; }
function currentStreak(){ try{ return (JSON.parse(localStorage.getItem(streakKey())||'{}').streak)||0; }catch(e){ return 0; } }
function bumpStreak(){
  const today = new Date().toISOString().slice(0,10);
  let data = {}; try{ data = JSON.parse(localStorage.getItem(streakKey())||'{}'); }catch(e){}
  if(data.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const streak = data.lastDate===yesterday ? (data.streak||0)+1 : 1;
  localStorage.setItem(streakKey(), JSON.stringify({lastDate:today, streak}));
}

// ---------- in-app back navigation ----------
// The app never changes the URL, so by default the phone's/browser's back
// button (or back gesture) has nothing to "undo" and just closes the app.
// To fix that, every time the user moves to a deeper/different screen we
// push one browser-history entry and remember a snapshot of where they
// were. A hardware/gesture back then fires `popstate`, which we catch here
// to restore that snapshot instead of letting the OS close the app. Only
// once our own stack is empty (i.e. we're back at the very first screen)
// does back behave like normal browser/app-exit back.
let navStack = [];
// Every navigation bumps this. Tab-loading functions are async (they await
// Supabase queries) — if the user navigates again before one finishes, its
// `.innerHTML +=` would land on top of whatever the *new* screen already
// rendered, since it's still writing to the same #utabBody by id. Each
// loader grabs its own token at the start and checks it's still current
// right before writing to the DOM; if not, a newer navigation has already
// taken over and it just quietly stops instead of appending stale content.
let navToken = 0;
function snapshotState(){
  return { view:S.view, utab:S.utab, atab:S.atab, nav:{...(S.nav||{})}, exam:S.exam||null, review:S.review||null };
}
// Wrap any navigation that should be "undo-able" with the back button:
// goTo({nav:{...}}) / goTo({utab:'stats'}) / goTo({view:'exam', exam:{...}}) etc.
function goTo(changes){
  navStack.push(snapshotState());
  history.pushState({d:navStack.length}, '');
  Object.assign(S, changes);
  render();
}
window.addEventListener('popstate', ()=>{
  // Leaving an in-progress exam via hardware back: stop the timer and flush
  // the latest answers, same as the explicit "← Back" button does.
  if(S.exam){
    clearInterval(timerHandle);
    clearTimeout(saveTimeout);
    sb.from('attempts').update({answers:S.exam.att.answers}).eq('id', S.exam.att.id);
  }
  if(navStack.length){
    const prev = navStack.pop();
    S.view=prev.view; S.utab=prev.utab; S.atab=prev.atab; S.nav=prev.nav||{}; S.exam=prev.exam||null; S.review=prev.review||null;
    render();
  } else if(S.exam || S.view==='exam'){
    // Nothing left on our stack, but we were mid-exam — land safely on the
    // dashboard rather than showing a broken exam screen.
    S.exam=null; S.view='user'; S.utab='qbanks'; S.nav={};
    render();
  }
  // else: our stack is empty and we're already on a top-level screen, so
  // there's nothing to intercept — let the platform's normal back happen.
});

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function getDeviceId(){
  let id = localStorage.getItem('qb_device_id');
  if(!id){ id = 'dev_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('qb_device_id', id); }
  return id;
}
function fmtTime(sec){
  if(sec<0) sec=0;
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  return (h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function statusOf(a){ return a ? a.status : 'not_visited'; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Strips tags, inline event handlers and javascript: URIs from any free-text
// field before it is written to Supabase. escapeHtml() protects render-time
// output; this protects the data itself, so a stored value can never carry
// a live script even if it is later rendered somewhere unescaped.
function sanitizeInput(s, maxLen){
  let v = (s==null ? '' : String(s));
  v = v.replace(/<[^>]*>/g, '');           // strip any HTML/script tags
  v = v.replace(/javascript:/gi, '');       // strip javascript: URIs
  v = v.replace(/on\w+\s*=/gi, '');         // strip inline event handlers (onclick=, onerror=, ...)
  v = v.trim();
  if(maxLen) v = v.slice(0, maxLen);
  return v;
}
// Custom-styled dropdown used in place of native <select> wherever the
// picker itself is the point of interest (e.g. the subject/group filter) —
// native <select> popups can't be restyled on mobile (Android renders its
// own OS list), so this renders/wires an in-page panel with our own themed
// radio icons instead. renderCselHtml() gives the trigger markup to embed;
// wireCsel() attaches the open/close/select behaviour right after that HTML
// lands in the DOM.
function renderCselHtml(id, options, selected){
  const sel = options.find(o=>o.value===selected) || options[0] || {label:''};
  return `<div class="csel" id="${id}">
    <div class="csel-trigger" data-role="trigger"><span class="csel-tlabel">${escapeHtml(sel.label)}</span><span class="csel-chev">▾</span></div>
  </div>`;
}
function wireCsel(id, options, selected, onSelect){
  const root = document.getElementById(id);
  if(!root) return;
  const trigger = root.querySelector('[data-role="trigger"]');
  trigger.onclick = (e)=>{
    e.stopPropagation();
    root.classList.add('open');
    openCselSheet(options, selected, onSelect, ()=>root.classList.remove('open'));
  };
}
// Bottom-sheet picker used by every custom-styled dropdown in the app.
// Rendered as a fixed full-screen overlay appended to <body> (not an
// absolutely-positioned panel inline in the page) so a long option list can
// never get visually clipped or end up looking like it's hidden behind
// whatever card happens to sit below the trigger — that was a real bug with
// the old inline-panel version on longer lists / shorter screens.
function openCselSheet(options, selected, onSelect, onClose){
  const overlay = document.createElement('div');
  overlay.className = 'csel-sheet-overlay';
  overlay.innerHTML = `<div class="csel-sheet">
    <div class="csel-sheet-handle"></div>
    <div class="csel-sheet-list">
      ${options.map(o=>`<div class="csel-opt ${o.value===selected?'sel':''}" data-v="${escapeHtml(o.value)}"><span class="csel-radio"></span><span class="csel-label">${escapeHtml(o.label)}</span></div>`).join('')}
    </div>
  </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('in'));
  let closed = false;
  function close(){
    if(closed) return;
    closed = true;
    overlay.classList.remove('in');
    onClose && onClose();
    setTimeout(()=>overlay.remove(), 180);
  }
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelectorAll('.csel-opt').forEach(row=>{
    row.onclick = ()=>{ close(); onSelect(row.dataset.v); };
  });
}

// Rich text renderer: supports plain text, **bold**, line breaks, and
// pipe tables (for "match the following" / tabular questions). Input is
// escaped first, so this never introduces unsafe HTML.
// Applies **bold** and inline ![alt](url) image syntax. Image syntax works
// anywhere — question stem, each option, explanation text, and even inside
// "match the following" table cells — so any phase/pattern (subject-wise,
// GT, INICET, NEET PG) can carry an image wherever it's placed, just by
// including ![](https://your-image-url) in that field's text.
function inlineFmt(s){
  return s
    .replace(/!\[([^\]]*)\]\((\S+?)\)/g, '<img class="qimg" src="$2" alt="$1">')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function renderRichText(raw){
  if(!raw) return '';
  const escaped = escapeHtml(raw);
  const lines = escaped.split(/\n/);
  let html = '', tableBuf = [], inTable = false;
  const flushTable = ()=>{
    if(!tableBuf.length) return;
    const rows = tableBuf.filter(r=>!/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(r));
    html += '<table class="rt">';
    rows.forEach((r,ri)=>{
      const cells = r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const tag = ri===0 ? 'th' : 'td';
      html += '<tr>' + cells.map(c=>`<${tag}>${inlineFmt(c)}</${tag}>`).join('') + '</tr>';
    });
    html += '</table>';
    tableBuf = [];
  };
  for(const line of lines){
    if(/^\s*\|.*\|\s*$/.test(line)){
      inTable = true; tableBuf.push(line); continue;
    } else if(inTable){
      flushTable(); inTable = false;
    }
    let l = inlineFmt(line);
    html += (html && !html.endsWith('</table>') ? '<br>' : '') + l;
  }
  if(inTable) flushTable();
  return html;
}
// Resolves a bare filename (e.g. "q1.png") referenced in the JSON against a
// map of {lowercased filename -> uploaded public URL}. Full http(s) URLs are
// left untouched, so existing JSON that already uses hosted image URLs keeps
// working exactly as before.
function resolveImageField(v, imageMap){
  if(!v) return v;
  if(/^https?:\/\//i.test(v)) return v;
  return (imageMap && imageMap[String(v).trim().toLowerCase()]) || v;
}
// Same idea but for inline ![alt](filename) refs inside rich text fields
// (question stem, options, explanation, table cells).
function resolveInlineImages(text, imageMap){
  if(!text) return text;
  return text.replace(/!\[([^\]]*)\]\((\S+?)\)/g, (m, alt, url)=>{
    if(/^https?:\/\//i.test(url)) return m;
    const resolved = imageMap && imageMap[url.trim().toLowerCase()];
    return resolved ? `![${alt}](${resolved})` : m;
  });
}
function richBlock(raw, imageUrl){
  let html = '';
  if(imageUrl) html += `<img class="qimg" src="${escapeHtml(imageUrl)}" alt="question image" loading="eager" fetchpriority="high" decoding="async">`;
  html += `<div>${renderRichText(raw)}</div>`;
  return html;
}

// ---------- boot ----------
async function boot(){
  S.deviceId = getDeviceId();
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session;
  if(session){ await loadProfile(); }
  render();
  sb.auth.onAuthStateChange((event, sess)=>{
    // Any of these events can re-fire for the SAME already-signed-in user
    // whenever the tab regains focus — which happens the instant the native
    // file picker closes after choosing a file. Re-rendering in that case
    // wipes whatever screen (and file selection) was in progress and looks
    // like the page refreshed itself. So we only reload profile + re-render
    // when the signed-in user has actually changed (real sign-in/out),
    // never just because Supabase re-emitted an event for the same user.
    const prevUserId = S.session?.user?.id || null;
    const nextUserId = sess?.user?.id || null;
    S.session = sess;
    if(prevUserId === nextUserId) return; // same user (or same signed-out state) — no-op
    if(sess) loadProfile().then(render); else { S.profile=null; S.view='auth'; render(); }
  });
}
async function loadProfile(){
  const email = S.session.user.email;
  const isAdminEmail = (email||'').trim().toLowerCase() === ADMIN_EMAIL.toLowerCase();
  let { data } = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle();
  if(!data){
    const ins = await sb.from('profiles').upsert({
      id:S.session.user.id, email,
      role: isAdminEmail?'admin':'user',
      status: isAdminEmail?'active':'pending'
    }, {onConflict:'id'}).select().maybeSingle();
    data = ins.data;
  }
  if(isAdminEmail && data && (data.role!=='admin' || data.status!=='active')){
    const upd = await sb.from('profiles').update({role:'admin', status:'active'}).eq('id', S.session.user.id).select().maybeSingle();
    if(upd.data) data = upd.data;
  }
  S.profile = data;
  if(S.profile && S.profile.role!=='admin'){
    // Subscription expired since last login: flip them to revoked and kick
    // them out straight to the login screen instead of letting them sit on
    // a "locked" screen while still technically signed in.
    const expired = (S.profile.status==='active' || S.profile.status==='verified') && S.profile.subscription_expiry && new Date(S.profile.subscription_expiry) <= new Date();
    if(expired){
      await sb.from('profiles').update({status:'revoked'}).eq('id', S.profile.id);
      S.authNotice = 'expired';
      await signOut();
      return;
    }
    await registerDevice();
    startExpiryWatcher();
  }
  S.view = S.profile?.role==='admin' ? 'admin' : 'user';
  if(S.profile) bumpStreak();
}
// Re-checks the logged-in user's own status/expiry every couple of minutes
// so an expiry that lands *during* an open session (or an admin
// revoking/deleting them while they're mid-session) also forces a sign-out,
// not just the check done at login.
let expiryWatcherHandle = null;
function startExpiryWatcher(){
  if(expiryWatcherHandle) return;
  expiryWatcherHandle = setInterval(async ()=>{
    if(!S.session || !S.profile || S.profile.role==='admin') return;
    const { data } = await sb.from('profiles').select('status, subscription_expiry').eq('id', S.profile.id).maybeSingle();
    if(!data){
      // Profile row is gone — admin deleted this account.
      clearInterval(expiryWatcherHandle); expiryWatcherHandle=null;
      S.authNotice = 'deleted';
      await signOut();
      return;
    }
    const expired = (data.status==='active' || data.status==='verified') && data.subscription_expiry && new Date(data.subscription_expiry) <= new Date();
    const revokedElsewhere = data.status==='revoked' && S.profile.status!=='revoked';
    if(expired || revokedElsewhere){
      if(expired) await sb.from('profiles').update({status:'revoked'}).eq('id', S.profile.id);
      clearInterval(expiryWatcherHandle); expiryWatcherHandle=null;
      S.authNotice = expired ? 'expired' : 'revoked';
      await signOut();
    }
  }, 120000);
}
async function registerDevice(){
  const { data: devices } = await sb.from('devices').select('*').eq('user_id', S.profile.id);
  const mine = (devices||[]).find(d=>d.device_id===S.deviceId);
  if(mine){
    await sb.from('devices').update({last_seen:new Date().toISOString()}).eq('id', mine.id);
    return;
  }
  const limit = S.profile.device_limit||1;
  if((devices||[]).length >= limit){
    S.deviceBlocked = true;
    return;
  }
  await sb.from('devices').insert({user_id:S.profile.id, device_id:S.deviceId});
}

// ---------- render dispatcher ----------
function render(){
  navToken++;
  if(!S.session){ return renderAuth(); }
  if(S.deviceBlocked){
    app.innerHTML = `<div class="container"><div class="card"><h2>Device limit reached</h2>
      <p class="muted">This account is already signed in on the maximum number of allowed devices. Ask your admin to increase your device limit, or sign out of another device.</p>
      <button class="ghost" id="so">Sign out</button></div></div>`;
    document.getElementById('so').onclick = signOut;
    return;
  }
  // Respect S.view here: an admin who has switched into "Practice (user
  // view)" should keep seeing the user-side screens as navigation happens
  // (e.g. via goTo/back), not get bounced back to the admin panel just
  // because their account role is admin.
  const showCrash = (e)=>{
    // Surface the real crash on-screen (with a copy button) instead of a
    // silent blank page — this is what makes debugging from a phone possible.
    // The raw stack trace is only shown to the admin account; students just
    // get a plain "something went wrong" message.
    console.error('[render crash]', e);
    const isAdminAcct = S.profile?.role==='admin';
    app.innerHTML = `<div class="container"><div class="card">
      <h3 style="color:var(--red);">Something went wrong loading this page</h3>
      <p class="muted">${isAdminAcct ? 'Screenshot this and send it — it tells us exactly what broke:' : "Please try reloading. If it keeps happening, use the Feedback tab to let us know."}</p>
      ${isAdminAcct ? `<pre style="white-space:pre-wrap;background:var(--surface-2);padding:12px;border-radius:10px;font-size:12px;color:var(--red);">${escapeHtml(String(e && e.stack || e))}</pre>` : ''}
      <button class="ghost" id="retryRender" style="margin-top:10px;">Reload</button>
    </div></div>`;
    const rb = document.getElementById('retryRender'); if(rb) rb.onclick = ()=>render();
  };
  try{
    const p = (S.profile?.role==='admin' && S.view!=='user') ? renderAdmin() : renderUser();
    if(p && typeof p.catch==='function') p.catch(showCrash);
  }catch(e){ showCrash(e); }
}

// ================= EDIT PROFILE (user side) =================
// Removes any existing file(s) under `${uid}/${baseName}.*` in the given
// storage bucket before uploading the replacement. Doing an explicit list+
// remove (rather than relying only on {upsert:true}) guarantees a clean
// swap even when the new file's extension differs from the old one (e.g.
// replacing a college_id.pdf with college_id.jpg) — otherwise the old file
// would be silently orphaned in storage instead of being replaced.
async function replaceUserFile(bucket, uid, baseName, file){
  const { data: existing, error: listErr } = await sb.storage.from(bucket).list(uid);
  if(listErr) return { error: listErr };
  const stale = (existing||[])
    .filter(f=> f.name.toLowerCase().startsWith(baseName+'.'))
    .map(f=> `${uid}/${f.name}`);
  if(stale.length){
    const { error: rmErr } = await sb.storage.from(bucket).remove(stale);
    if(rmErr) return { error: rmErr };
  }
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${uid}/${baseName}.${ext}`;
  const { error: upErr } = await sb.storage.from(bucket).upload(path, file, {upsert:true, contentType: file.type||undefined});
  if(upErr) return { error: upErr };
  return { path };
}
function openEditProfileModal(){

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:460px;">
    <button class="modal-x" id="epClose" title="Close">✕</button>
    <h3 style="margin-top:0;">Edit Profile</h3>
    <label>Full name</label><input id="epName" value="${(p.name||'').replace(/"/g,'&quot;')}">
    <label>Batch</label><input id="epBatch" value="${(p.batch||'').replace(/"/g,'&quot;')}">
    <label>College ID / Roll Number</label>
    <input id="epRoll" placeholder="e.g. 21MBBS045" value="${(p.roll_number||'').replace(/"/g,'&quot;')}">

      <div class="filepick" style="flex:1;margin-top:0;"><input id="epAvatar" type="file" accept="image/*"></div>
    </div>

    <button class="primary" id="epSave" style="width:100%;margin-top:16px;">Save changes</button>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('epClose').onclick = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('epSave').onclick = ()=> saveEditProfile(overlay);
}
async function saveEditProfile(overlay){
  const errEl = overlay.querySelector('#epErr'); errEl.textContent='';
  const btn = overlay.querySelector('#epSave');
  const name = sanitizeInput(overlay.querySelector('#epName').value, 100);
  const batch = sanitizeInput(overlay.querySelector('#epBatch').value, 60);
  const rollNumber = sanitizeInput(overlay.querySelector('#epRoll').value, 40);
  const avatarFile = overlay.querySelector('#epAvatar').files[0];
  const collegeIdFile = overlay.querySelector('#epCollegeId').files[0];
  if(!name){ errEl.textContent = 'Name cannot be empty.'; return; }
  if(!batch){ errEl.textContent = 'Batch cannot be empty.'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const uid = S.profile.id;
  const extra = { name, batch, roll_number: rollNumber || null };
  if(avatarFile){
    const res = await replaceUserFile('avatars', uid, 'avatar', avatarFile);
    if(res.error){ errEl.textContent = 'Photo upload failed — '+res.error.message; btn.disabled=false; btn.textContent='Save changes'; return; }
    extra.avatar_url = sb.storage.from('avatars').getPublicUrl(res.path).data.publicUrl;
  }
  if(collegeIdFile){
    const res = await replaceUserFile('college-ids', uid, 'college_id', collegeIdFile);
    if(res.error){ errEl.textContent = 'College ID upload failed — '+res.error.message; btn.disabled=false; btn.textContent='Save changes'; return; }
    extra.college_id_path = res.path;
  }
  const { error: saveErr } = await sb.from('profiles').update(extra).eq('id', uid);
  if(saveErr){ errEl.textContent = 'Save failed — '+saveErr.message; btn.disabled=false; btn.textContent='Save changes'; return; }
  S.profile = { ...S.profile, ...extra };
  toast('Profile updated');
  overlay.remove();
  render();
}

    if(!email||!password){ errEl.textContent='Enter email and password.'; return; }
    const btn = document.getElementById('authGo');
    if(S.authMode==='signup'){
      const name = document.getElementById('suName').value.trim();
      const age = document.getElementById('suAge').value;
      const batch = document.getElementById('suBatch').value.trim();
      const college = document.getElementById('suCollege').value.trim();

      // signup form collected, uploading avatar/college-id if provided.
      const uid = session.user.id;
      const extra = { name, age: age?+age:null, batch, college };
      btn.textContent = 'Saving profile…';
      if(avatarFile){
        const ext = (avatarFile.name.split('.').pop()||'jpg').toLowerCase();

        if(!up.error){ extra.avatar_url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl; }
      }
      if(idFile){
        const ext = (idFile.name.split('.').pop()||'jpg').toLowerCase();
        const path = `${uid}/college_id.${ext}`;
        const up = await sb.storage.from('college-ids').upload(path, idFile, {upsert:true, contentType: idFile.type||undefined});
        if(!up.error){ extra.college_id_path = path; }
      }
      await sb.from('profiles').update(extra).eq('id', uid);
      S.profile = { ...S.profile, ...extra };
      render();
      return;
    }
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent=error.message; btn.disabled=false; return; }
    const { data:{ session } } = await sb.auth.getSession();
    S.session=session; await loadProfile(); render();
  };
}

// ---- QBank -> Category -> Folder -> Sets navigation ----
function crumbBar(items){
  // items: [{label, onClick}]
  return `<div class="crumbs">` + items.map((it,i)=>{
    const sep = i>0 ? ' / ' : '';
    return sep + (it.onClick ? `<span data-crumb="${i}">${it.label}</span>` : it.label);
  }).join('') + `</div>`;
}
async function loadQbanksNav(isActive){
  if(!S.nav.qbankId){ return loadQbankList(isActive); }
  if(!S.nav.category){ return loadCategoryList(isActive); }
  if(!S.nav.folderId){ return loadFolderList(isActive); }
  return loadFolderSets(isActive);
}

        </div>

        <div class="muted" style="font-size:12px;margin-top:4px;">${myCoupon.usage_count}/${myCoupon.target_quota} joined${myCoupon.milestone_reached?' — 🎉 milestone reached!':''}</div>

    sb.from('folders').select('id', {count:'exact', head:true}).eq('qbank_id', qb.id)
  ));
  if(myToken !== navToken) return;

// Level 2: shows the 5 top-level category cards (Subject-wise / Tests / GT /
// NEET PG / INICET) for this qbank. Deliberately fetches only id/name/exam_type
// for every folder (no count queries here) — grouping is done client-side for
// free. This is what removes the lag that used to happen when opening a
// platform with 200+ sections: previously every section's question-count was
// queried at once right here; now that only happens per-category (see
// loadFolderList), on a much smaller batch.
async function loadCategoryList(isActive){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const { data: qb } = await sb.from('qbanks').select('*').eq('id', S.nav.qbankId).maybeSingle();
  if(myToken !== navToken) return;
  body.innerHTML += crumbBar([{label:'QBanks', onClick:true},{label:qb?.name||'QBank'}]);
  const folders = await fetchAllRows(()=>sb.from('folders').select('id, name, exam_type').eq('qbank_id', S.nav.qbankId));
  if(myToken !== navToken) return;
  if(!folders || !folders.length){ document.getElementById('utabBody').innerHTML += emptyStateHtml('📭', 'No sections in this qbank yet', 'Check back soon — content is on its way.'); return; }
  const byCat = {};
  folders.forEach(f=>{ const c=categoryOf(f); (byCat[c]=byCat[c]||[]).push(f); });
  let html = '<div class="grid">';
  const orderedCats = CATEGORY_ORDER.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CATEGORY_ORDER.includes(c)));
  orderedCats.forEach(cat=>{
    html += `<div class="card" style="cursor:pointer;" data-cat="${cat}"><h3>${cat}</h3><div class="muted">${byCat[cat].length} section${byCat[cat].length===1?'':'s'}</div></div>`;
  });
  html += '</div>';
  if(myToken !== navToken) return;
  document.getElementById('utabBody').innerHTML += html;
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{ goTo({nav:{...S.nav, category: el.dataset.cat}}); });
  const crumb = document.querySelector('[data-crumb="0"]');
  if(crumb) crumb.onclick = ()=>{ goTo({nav:{}}); };
}
async function loadFolderList(isActive){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const { data: qb } = await sb.from('qbanks').select('*').eq('id', S.nav.qbankId).maybeSingle();
  if(myToken !== navToken) return;
  body.innerHTML += crumbBar([{label:'QBanks', onClick:true},{label:qb?.name||'QBank', onClick:true},{label:S.nav.category}]);
  const allFolders = await fetchAllRows(()=>sb.from('folders').select('*').eq('qbank_id', S.nav.qbankId));
  if(myToken !== navToken) return;
  const folders = (allFolders||[]).filter(f=>categoryOf(f)===S.nav.category);
  folders.sort((a,b)=>naturalCompare(leafNameOf(a.name), leafNameOf(b.name)));

  // Within a category, folders can still be further grouped by name prefix
  // (e.g. inside "Subject-wise": "Anatomy - Abdomen", "Anatomy - Thorax" ->
  // "Anatomy"). Only shown if there's more than one group.
  function groupOf(name){ return subGroupOf(name); }
  const groups = [...new Set(folders.map(f=>groupOf(f.name)))].sort();

  function renderList(filterGroup, loading){
    if(myToken !== navToken) return;
    let html = '';
    let groupOptions = null;
    if(groups.length>1){
      groupOptions = [{value:'__all__', label:`📚 All in ${S.nav.category} (${folders.length})`}].concat(
        groups.map(g=>({ value:g, label:`${subjectIcon(g)} ${g} (${folders.filter(f=>groupOf(f.name)===g).length})` }))
      );
      html += `<div class="row" style="margin-bottom:14px;">${renderCselHtml('folderGroupSel', groupOptions, filterGroup)}</div>`;
    }
    const visible = folders.filter(f=> filterGroup==='__all__' || groupOf(f.name)===filterGroup);
    if(!visible.length){
      html += emptyStateHtml('🗂️', 'No sections in this group', 'Try a different subject filter above.');
    } else {
      visible.forEach(f=>{
        const rank = f._rank;
        const pct = rank && rank.user_total ? Math.round((rank.user_correct/rank.user_total)*1000)/10 : null;
        html += `<div class="qrow" data-folder="${f.id}" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div class="row" style="justify-content:space-between;align-items:center;">
            <b>${subjectIcon(f.name)} ${leafNameOf(f.name)}</b>
            ${pct!=null ? `<div class="donut sm" style="--pct:${pct}"><span>${pct}%</span></div>` : ''}
          </div>
          <div class="muted" style="font-size:12.5px;">${!f.exam_type ? 'Not set up yet' : '📋 Read the instructions before you start'}</div>
          ${pct!=null ? `<div class="muted" style="font-size:12px;color:var(--amber);">${rank.rank?`${rank.percentile}ᵗʰ percentile (updates as more people attempt)`:'Not enough attempts yet to rank'}</div>` : ''}
        </div>`;
      });
    }
    const listArea = document.getElementById('folderListArea');
    if(!listArea) return;
    listArea.innerHTML = html;
    if(groupOptions) wireCsel('folderGroupSel', groupOptions, filterGroup, (v)=>{ curFilterGroup = v; renderList(curFilterGroup, loading); });
    document.querySelectorAll('[data-folder]').forEach(el=>{
      el.onclick = async ()=>{
        const fid = el.dataset.folder;
        const { data: f } = await sb.from('folders').select('*').eq('id', fid).maybeSingle();
        if(!f.exam_type){ toast('Admin has not configured this section yet'); return; }
        goTo({nav:{...S.nav, folderId: fid}});
      };
    });
  }

  if(myToken !== navToken) return;
  document.getElementById('utabBody').innerHTML += `<div id="folderListArea"></div>`;
  // Show the list of section names right away — this is what the person is
  // actually here for — instead of leaving the screen blank while question
  // counts, subsection counts, and everyone's rank stats load underneath.
  // Those details fill themselves in a moment later without another tap.
  let curFilterGroup = '__all__';
  renderList(curFilterGroup, true);
  const crumb0 = document.querySelector('[data-crumb="0"]');
  if(crumb0) crumb0.onclick = ()=>{ goTo({nav:{}}); };
  const crumb1 = document.querySelector('[data-crumb="1"]');
  if(crumb1) crumb1.onclick = ()=>{ goTo({nav:{qbankId:S.nav.qbankId}}); };

  // One round trip for all folder counts in this category, instead of one
  // count query per folder — this was the main lag when opening a platform.
  const countMap = await countsByFolder(folders.map(f=>f.id));
  if(myToken !== navToken) return;
  folders.forEach(f=>{ f._count = countMap[f.id]||0; });
  renderList(curFilterGroup, false);

  // How many subsections ("sub-folders") each section splits into, and this
  // user's live score/percentile per section — both batched (one query +
  // one set of parallel RPC calls) instead of a query per folder. This is
  // the slowest part (a rank RPC per section), so it fills in last, after
  // the list and its question counts are already on screen.
  const { data: setRows } = await sb.from('sets').select('folder_id').is('user_id', null).eq('set_type','main').in('folder_id', folders.map(f=>f.id));
  if(myToken !== navToken) return;
  const setCountMap = {};
  (setRows||[]).forEach(r=>{ setCountMap[r.folder_id] = (setCountMap[r.folder_id]||0)+1; });
  folders.forEach(f=>{
    f._setCount = setCountMap[f.id]||0;
    f._avgPerSet = f._setCount ? Math.round((f._count||0)/f._setCount) : (f._count||0);
  });
  renderList(curFilterGroup, false);

  const rankResults = await Promise.all(folders.map(f=>sb.rpc('folder_rank_stats', { p_folder_id: f.id, p_user_id: S.profile.id })));
  if(myToken !== navToken) return;
  folders.forEach((f,i)=>{
    const r = rankResults[i]?.data; const row = Array.isArray(r)?r[0]:r;
    f._rank = (row && row.sets_completed) ? row : null;
  });
  renderList(curFilterGroup, false);
}
// Shared "before you start" disclaimer card — shown once per folder (any
// exam pattern, including subject-wise) before its sets are revealed, and
// reused verbatim before a user starts a self-built custom test, so the
// same rules/timer/palette explanation appears everywhere a timed set is
// about to begin, not just the sequential exam patterns.
function instructionsCardHtml(opts){
  const { title, totalQ, totalMin, setCount, sequential, setRowsHtml } = opts;
  return `<div class="card">
      <h3>📋 Before you start — ${escapeHtml(title)}</h3>
      <ul style="margin:10px 0; padding-left:20px; line-height:1.7;">
        <li>${setCount>1 ? `This section has <b>${totalQ} questions</b> split into <b>${setCount} timed sets</b>, totaling <b>${totalMin} minutes</b>.` : `This set has <b>${totalQ} questions</b>, timed at <b>${totalMin} minutes</b>.`}</li>
        <li>Each set has its <b>own timer</b>. When a set's timer runs out, it auto-submits with whatever you've answered so far.</li>
        ${sequential ? `<li>Sets must be done <b>in order</b> — a set unlocks only after you submit the one before it. You can't go back and reopen a submitted set.</li>` : ''}
        <li>Don't refresh, close the tab, or switch apps mid-set — the timer keeps running in the background regardless.</li>
        <li>Attempt every question if you can; there's no going back once a set is submitted, so mark your best answer before time runs out.</li>
        <li>Once every set is submitted, you'll see your full report card — score, rank, and question-difficulty breakdown.</li>
      </ul>
      ${setRowsHtml ? `<div class="muted" style="font-size:12px;margin-top:14px;">Time per set</div><div style="margin:6px 0 4px;">${setRowsHtml}</div>` : ''}
      <div class="muted" style="font-size:12px;margin-top:14px;">Question palette colours (shown while you attempt)</div>
      <div class="legend" style="margin-top:6px;">
        <div><span style="background:var(--gray)"></span>Not visited</div>
        <div><span style="background:var(--red)"></span>Not answered</div>
        <div><span style="background:var(--green)"></span>Answered</div>
        <div><span style="background:var(--purple)"></span>Marked for review</div>
        <div><span style="background:var(--purple);box-shadow:inset 0 0 0 2px var(--green)"></span>Answered &amp; marked</div>
      </div>
      <button class="primary" id="startExamBtn" style="margin-top:16px;">Start Exam</button>
